<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Calcul des permissions par défaut avec umask</title>
  <desc id="d">Pour un fichier, le mode de base est 666 ; pour un répertoire, 777. L'umask 022 retire les droits d'écriture au groupe et aux autres : le fichier obtient 644 (rw-r--r--) et le répertoire 755 (rwxr-xr-x).</desc>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">umask 022 : ce qu'on retire aux droits de départ</text>
  <g font-family="sans-serif" font-size="17" fill="#111111">
    <rect x="20" y="60" width="360" height="150" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="200" y="88" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Nouveau FICHIER</text>
    <text x="40" y="122" font-family="monospace" font-size="19">départ   : 666  rw-rw-rw-</text>
    <text x="40" y="152" font-family="monospace" font-size="19">umask    : 022  ---w--w-</text>
    <line x1="40" y1="162" x2="360" y2="162" stroke="#111111" stroke-width="2"/>
    <text x="40" y="192" font-family="monospace" font-size="19" font-weight="bold">résultat : 644  rw-r--r--</text>

    <rect x="420" y="60" width="360" height="150" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="600" y="88" text-anchor="middle" font-weight="bold" fill="#14532d">Nouveau RÉPERTOIRE</text>
    <text x="440" y="122" font-family="monospace" font-size="19">départ   : 777  rwxrwxrwx</text>
    <text x="440" y="152" font-family="monospace" font-size="19">umask    : 022  ---w--w-</text>
    <line x1="440" y1="162" x2="760" y2="162" stroke="#111111" stroke-width="2"/>
    <text x="440" y="192" font-family="monospace" font-size="19" font-weight="bold">résultat : 755  rwxr-xr-x</text>
  </g>
  <rect x="20" y="236" width="760" height="144" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="2"/>
  <g font-family="sans-serif" font-size="17" fill="#111111">
    <text x="40" y="266" font-weight="bold">Tableau des valeurs octales</text>
    <text x="40" y="294" font-family="monospace" font-size="18">r = 4   w = 2   x = 1   (lecture + écriture = 6, tout = 7)</text>
    <text x="40" y="322" font-family="monospace" font-size="18">umask 027 : fichier 640, répertoire 750 (rien pour « autres »)</text>
    <text x="40" y="350" font-family="monospace" font-size="18">umask 077 : fichier 600, répertoire 700 (propriétaire seul)</text>
  </g>
</svg>
