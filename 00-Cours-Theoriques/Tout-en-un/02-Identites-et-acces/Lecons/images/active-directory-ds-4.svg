<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="sans-serif">
  <title id="t">Structure logique et structure physique d'Active Directory</title>
  <desc id="d">À gauche, la hiérarchie logique : une forêt contient le domaine example.test, qui contient des unités d'organisation (Utilisateurs, Postes, Serveurs, Groupes). À droite, la structure physique : deux sites (192.0.2.0/24 et 198.51.100.0/24) hébergeant trois contrôleurs de domaine reliés par un lien de site.</desc>
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="200" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#0b2e59">Structure logique</text>
  <text x="600" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#7a2e00">Structure physique</text>
  <line x1="400" y1="45" x2="400" y2="505" stroke="#555555" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="20" y="50" width="360" height="450" rx="12" fill="#eaf2fb" stroke="#0b2e59" stroke-width="3"/>
  <text x="36" y="78" font-size="16" font-weight="bold" fill="#0b2e59">Forêt : example.test</text>
  <rect x="40" y="95" width="320" height="390" rx="10" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
  <text x="56" y="122" font-size="16" font-weight="bold" fill="#0b2e59">Domaine : example.test</text>
  <text x="56" y="144" font-size="14" fill="#222222">DC=example,DC=test</text>
  <rect x="62" y="160" width="276" height="44" rx="6" fill="#d6e6f8" stroke="#1f5fa8" stroke-width="2"/>
  <text x="200" y="188" font-size="15" text-anchor="middle" fill="#0b2e59">OU=Entreprise</text>
  <line x1="200" y1="204" x2="200" y2="220" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="95" y1="220" x2="305" y2="220" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="95" y1="220" x2="95" y2="236" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="305" y1="220" x2="305" y2="236" stroke="#1f5fa8" stroke-width="2"/>
  <rect x="55" y="236" width="120" height="40" rx="6" fill="#d6e6f8" stroke="#1f5fa8" stroke-width="2"/>
  <text x="115" y="262" font-size="14" text-anchor="middle" fill="#0b2e59">OU=Utilisateurs</text>
  <rect x="225" y="236" width="120" height="40" rx="6" fill="#d6e6f8" stroke="#1f5fa8" stroke-width="2"/>
  <text x="285" y="262" font-size="14" text-anchor="middle" fill="#0b2e59">OU=Postes</text>
  <rect x="55" y="296" width="120" height="40" rx="6" fill="#d6e6f8" stroke="#1f5fa8" stroke-width="2"/>
  <text x="115" y="322" font-size="14" text-anchor="middle" fill="#0b2e59">OU=Serveurs</text>
  <rect x="225" y="296" width="120" height="40" rx="6" fill="#d6e6f8" stroke="#1f5fa8" stroke-width="2"/>
  <text x="285" y="322" font-size="14" text-anchor="middle" fill="#0b2e59">OU=Groupes</text>
  <text x="200" y="372" font-size="14" text-anchor="middle" fill="#222222">Conteneurs par défaut : CN=Users,</text>
  <text x="200" y="392" font-size="14" text-anchor="middle" fill="#222222">CN=Computers (non liables aux GPO)</text>
  <text x="200" y="430" font-size="14" text-anchor="middle" fill="#222222">Une partition de domaine + schéma,</text>
  <text x="200" y="450" font-size="14" text-anchor="middle" fill="#222222">configuration et catalogue global</text>
  <text x="200" y="470" font-size="14" text-anchor="middle" fill="#222222">partagés à l'échelle de la forêt</text>

  <rect x="420" y="50" width="360" height="450" rx="12" fill="#fff4e8" stroke="#7a2e00" stroke-width="3"/>
  <rect x="440" y="70" width="320" height="170" rx="10" fill="#ffffff" stroke="#b34700" stroke-width="3"/>
  <text x="456" y="96" font-size="16" font-weight="bold" fill="#7a2e00">Site : Site-Paris</text>
  <text x="456" y="116" font-size="14" fill="#222222">Sous-réseau 192.0.2.0/24</text>
  <rect x="456" y="132" width="130" height="90" rx="6" fill="#ffe0c2" stroke="#b34700" stroke-width="2"/>
  <text x="521" y="162" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a2e00">DC1</text>
  <text x="521" y="184" font-size="13" text-anchor="middle" fill="#222222">192.0.2.10</text>
  <text x="521" y="204" font-size="13" text-anchor="middle" fill="#222222">DNS + GC</text>
  <rect x="612" y="132" width="130" height="90" rx="6" fill="#ffe0c2" stroke="#b34700" stroke-width="2"/>
  <text x="677" y="162" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a2e00">DC2</text>
  <text x="677" y="184" font-size="13" text-anchor="middle" fill="#222222">192.0.2.11</text>
  <text x="677" y="204" font-size="13" text-anchor="middle" fill="#222222">DNS</text>
  <line x1="586" y1="177" x2="612" y2="177" stroke="#7a2e00" stroke-width="3"/>

  <line x1="600" y1="240" x2="600" y2="300" stroke="#7a2e00" stroke-width="4"/>
  <rect x="520" y="256" width="160" height="30" rx="15" fill="#ffffff" stroke="#7a2e00" stroke-width="2"/>
  <text x="600" y="276" font-size="14" text-anchor="middle" fill="#7a2e00">Lien de site (coût 100)</text>

  <rect x="440" y="300" width="320" height="180" rx="10" fill="#ffffff" stroke="#b34700" stroke-width="3"/>
  <text x="456" y="326" font-size="16" font-weight="bold" fill="#7a2e00">Site : Site-Lyon</text>
  <text x="456" y="346" font-size="14" fill="#222222">Sous-réseau 198.51.100.0/24</text>
  <rect x="456" y="366" width="130" height="90" rx="6" fill="#ffe0c2" stroke="#b34700" stroke-width="2"/>
  <text x="521" y="396" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a2e00">DC3</text>
  <text x="521" y="418" font-size="13" text-anchor="middle" fill="#222222">198.51.100.10</text>
  <text x="521" y="438" font-size="13" text-anchor="middle" fill="#222222">DNS + GC</text>
  <text x="600" y="402" font-size="14" fill="#222222">Les clients de ce</text>
  <text x="600" y="422" font-size="14" fill="#222222">sous-réseau choisissent</text>
  <text x="600" y="442" font-size="14" fill="#222222">DC3 en priorité</text>
</svg>
