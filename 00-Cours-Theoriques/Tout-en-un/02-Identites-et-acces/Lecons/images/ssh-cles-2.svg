<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d">
  <title id="t">Rebond SSH par un bastion avec ProxyJump</title>
  <desc id="d">Le poste de l'administrateur (192.0.2.10) se connecte au bastion (198.51.100.5) exposé sur Internet. Le bastion relaie ensuite la connexion SSH vers les serveurs internes 203.0.113.11 et 203.0.113.12 qui ne sont pas directement joignables depuis Internet. La commande est ssh -J bastion serveur.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
  </defs>
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">Bastion + ProxyJump : une seule porte d'entrée</text>
  <rect x="520" y="55" width="260" height="215" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="650" y="78" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">Interne 203.0.113.0/24</text>
  <g font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">
    <rect x="20" y="130" width="170" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="105" y="160" font-weight="bold">Poste admin</text>
    <text x="105" y="184">192.0.2.10</text>

    <rect x="290" y="130" width="170" height="80" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="375" y="160" font-weight="bold">Bastion</text>
    <text x="375" y="184">198.51.100.5 : 22</text>

    <rect x="560" y="95" width="180" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="650" y="120" font-weight="bold">srv-app</text>
    <text x="650" y="142">203.0.113.11</text>

    <rect x="560" y="185" width="180" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="650" y="210" font-weight="bold">srv-bdd</text>
    <text x="650" y="232">203.0.113.12</text>
  </g>
  <line x1="190" y1="170" x2="288" y2="170" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
  <line x1="460" y1="160" x2="558" y2="127" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
  <line x1="460" y1="180" x2="558" y2="212" stroke="#111111" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">
    <text x="240" y="152">SSH ①</text>
    <text x="478" y="118">SSH ②</text>
  </g>
  <rect x="20" y="290" width="760" height="55" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="2"/>
  <g font-family="monospace" font-size="17" fill="#111111">
    <text x="36" y="313">ssh -J admin@bastion.example.com alice@203.0.113.11</text>
    <text x="36" y="335" font-family="sans-serif" font-size="15">La clé privée reste sur le poste : le bastion ne fait que relayer le flux chiffré de bout en bout.</text>
  </g>
</svg>
