<title id="t">Régions et zones de disponibilité</title>
<desc id="d">Deux régions géographiques distinctes, chacune contenant trois zones de disponibilité reliées par un réseau rapide. Une application répartie sur plusieurs zones survit à la perte d'une zone ; la réplication entre régions protège contre un sinistre régional.</desc>
