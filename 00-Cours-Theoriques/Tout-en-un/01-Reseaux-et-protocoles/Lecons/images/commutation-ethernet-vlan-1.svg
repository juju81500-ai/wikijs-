<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d">
<title id="t">Commutateur et table d'adresses MAC</title>
<desc id="d">Un commutateur à quatre ports relie les postes A, B, C et D. Sa table MAC associe chaque adresse MAC au port où elle a été apprise. Une trame de A vers C est envoyée uniquement sur le port 3.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b00020"/></marker></defs>
<rect width="800" height="460" fill="#ffffff"/>
<rect x="250" y="150" width="300" height="70" rx="8" fill="#e8ecf1" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="180" font-family="sans-serif" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">Commutateur (switch)</text>
<text x="400" y="205" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle" font-weight="normal">ports 1 à 4</text>
<rect x="60" y="310" width="140" height="70" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="130" y="340" font-family="sans-serif" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="bold">Poste A</text>
<text x="130" y="365" font-family="monospace" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="normal">MAC …:53:01</text>
<line x1="130" y1="310" x2="290" y2="220" stroke="#1b2a41" stroke-width="3"/>
<rect x="230" y="310" width="140" height="70" rx="8" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="300" y="340" font-family="sans-serif" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="bold">Poste B</text>
<text x="300" y="365" font-family="monospace" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="normal">MAC …:53:02</text>
<line x1="300" y1="310" x2="350" y2="220" stroke="#1b2a41" stroke-width="3"/>
<rect x="430" y="310" width="140" height="70" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="500" y="340" font-family="sans-serif" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="bold">Poste C</text>
<text x="500" y="365" font-family="monospace" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="normal">MAC …:53:03</text>
<line x1="500" y1="310" x2="450" y2="220" stroke="#1b2a41" stroke-width="3"/>
<rect x="600" y="310" width="140" height="70" rx="8" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="670" y="340" font-family="sans-serif" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="bold">Poste D</text>
<text x="670" y="365" font-family="monospace" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="normal">MAC …:53:04</text>
<line x1="670" y1="310" x2="510" y2="220" stroke="#1b2a41" stroke-width="3"/>
<circle cx="290" cy="220" r="13" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="290" y="226" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">1</text>
<circle cx="350" cy="220" r="13" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="350" y="226" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">2</text>
<circle cx="450" cy="220" r="13" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="450" y="226" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">3</text>
<circle cx="510" cy="220" r="13" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="510" y="226" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">4</text>
<line x1="120" y1="300" x2="262" y2="236" stroke="#b00020" stroke-width="3" marker-end="url(#arrr)"/>
<line x1="425" y1="236" x2="470" y2="300" stroke="#b00020" stroke-width="3" marker-end="url(#arrr)"/>
<text x="30" y="270" font-family="sans-serif" font-size="15" fill="#b00020" text-anchor="start" font-weight="bold">A envoie vers C</text>
<rect x="20" y="20" width="320" height="110" rx="8" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="180" y="45" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="middle" font-weight="bold">Table MAC (apprise)</text>
<text x="36" y="70" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">MAC source …:53:01 → port 1</text>
<text x="36" y="88" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">MAC source …:53:03 → port 3</text>
<text x="36" y="106" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">(ligne vide pour B et D tant</text>
<text x="36" y="124" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">qu'ils n'ont pas émis)</text>
<rect x="440" y="20" width="340" height="110" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2" stroke-dasharray="6 4"/>
<text x="610" y="45" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="middle" font-weight="bold">Règle de décision</text>
<text x="455" y="70" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">Source inconnue : on l'apprend.</text>
<text x="455" y="88" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">Destination connue : 1 seul port.</text>
<text x="455" y="106" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">Destination inconnue/diffusion :</text>
<text x="455" y="124" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="start" font-weight="normal">inondation sur tous les autres ports.</text>
<text x="400" y="430" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="normal">Adresses MAC fictives de la plage de documentation 00:00:5E:00:53:xx (RFC 7042)</text>
</svg>
