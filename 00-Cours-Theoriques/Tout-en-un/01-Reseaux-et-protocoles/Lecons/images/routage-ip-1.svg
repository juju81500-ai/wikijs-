<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Deux réseaux locaux reliés par deux routeurs</title>
<desc id="d">Le réseau 192.0.2.0/24 contient le poste PC1 qui a pour passerelle R1 en 192.0.2.1. R1 et R2 sont reliés par le réseau 198.51.100.0/30. Le réseau 203.0.113.0/24 contient le serveur SRV dont la passerelle est R2 en 203.0.113.1.</desc>
