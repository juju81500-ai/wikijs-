<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
<title id="t">Modes de l'interface en ligne de commande de type Cisco IOS</title>
<desc id="d">Quatre niveaux emboîtés : mode utilisateur avec invite Router&gt;, mode privilégié Router#, configuration globale Router(config)#, puis configuration d'interface Router(config-if)#. Les commandes enable, configure terminal, interface et end ou exit permettent de passer de l'un à l'autre.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b00020"/></marker></defs>
<rect width="800" height="480" fill="#ffffff"/>
<text x="400" y="30" font-family="sans-serif" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">Les modes de la CLI de type Cisco IOS (lab)</text>
<rect x="10" y="60" width="480" height="75" rx="8" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="30" y="90" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Mode utilisateur</text>
<text x="30" y="118" font-family="monospace" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Router&gt;</text>
<text x="480" y="118" font-family="sans-serif" font-size="12" fill="#1b2a41" text-anchor="end" font-weight="normal">consultation limitée</text>
<rect x="50" y="160" width="480" height="75" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="70" y="190" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Mode privilégié</text>
<text x="70" y="218" font-family="monospace" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Router#</text>
<text x="520" y="218" font-family="sans-serif" font-size="12" fill="#1b2a41" text-anchor="end" font-weight="normal">show, debug, copy</text>
<rect x="90" y="260" width="480" height="75" rx="8" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="110" y="290" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Configuration globale</text>
<text x="110" y="318" font-family="monospace" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Router(config)#</text>
<text x="560" y="318" font-family="sans-serif" font-size="12" fill="#1b2a41" text-anchor="end" font-weight="normal">hostname, ip route, access-list</text>
<rect x="130" y="360" width="480" height="75" rx="8" fill="#ffe0b8" stroke="#1b2a41" stroke-width="2"/>
<text x="150" y="390" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Configuration d'interface</text>
<text x="150" y="418" font-family="monospace" font-size="18" fill="#1b2a41" text-anchor="start" font-weight="bold">Router(config-if)#</text>
<text x="600" y="418" font-family="sans-serif" font-size="12" fill="#1b2a41" text-anchor="end" font-weight="normal">ip address, ip access-group</text>
<line x1="45" y1="135" x2="45" y2="160" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<line x1="85" y1="235" x2="85" y2="260" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<line x1="125" y1="335" x2="125" y2="360" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<rect x="650" y="60" width="140" height="150" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="720" y="85" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">Monter :</text>
<text x="720" y="108" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">enable</text>
<text x="720" y="128" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">configure</text>
<text x="720" y="148" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">terminal</text>
<text x="720" y="168" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">interface …</text>
<rect x="650" y="230" width="140" height="100" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="720" y="255" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">Descendre :</text>
<text x="720" y="278" font-family="monospace" font-size="12" fill="#1b2a41" text-anchor="middle" font-weight="normal">exit (1 niveau)</text>
<text x="720" y="298" font-family="monospace" font-size="12" fill="#1b2a41" text-anchor="middle" font-weight="normal">end (retour à #)</text>
<rect x="650" y="350" width="140" height="90" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="720" y="375" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">Aide :</text>
<text x="720" y="398" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">?   Tab</text>
<text x="720" y="418" font-family="monospace" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">do show …</text>
<text x="400" y="468" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">Toutes les commandes des exemples sont destinées à un lab (simulateur ou matériel jetable).</text>
</svg>
