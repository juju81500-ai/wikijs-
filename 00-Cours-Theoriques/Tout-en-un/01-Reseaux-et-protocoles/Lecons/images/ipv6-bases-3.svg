<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d">
  <title id="t">Trois façons de faire coexister IPv4 et IPv6 : double pile, tunnel, traduction NAT64</title>
  <desc id="d">Trois colonnes. Double pile : un client possédant une adresse IPv4 et une adresse IPv6 contacte un serveur disponible dans les deux protocoles. Tunnel : deux îlots IPv6 sont reliés à travers un réseau IPv4 grâce à un paquet IPv6 encapsulé dans IPv4. NAT64 : un client IPv6 seul atteint un serveur IPv4 seul via une passerelle de traduction et un DNS64.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
  <text x="400" y="26" font-size="20" font-weight="bold" text-anchor="middle">Coexister : double pile, tunnel, traduction</text>
<rect x="20" y="44" width="220" height="396" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="130" y="68" text-anchor="middle" font-weight="bold" font-size="16">1 · Double pile</text>
<rect x="290" y="44" width="220" height="396" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="400" y="68" text-anchor="middle" font-weight="bold" font-size="16">2 · Tunnel</text>
<rect x="560" y="44" width="220" height="396" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="670" y="68" text-anchor="middle" font-weight="bold" font-size="16">3 · Traduction NAT64</text>
<rect x="40" y="90" width="180" height="60" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="130.0" y="117.0" text-anchor="middle" font-size="13">Client</text><text x="130.0" y="133.0" text-anchor="middle" font-size="13">IPv4 + IPv6</text>
<line x1="130" y1="150" x2="130" y2="190" stroke="#111" stroke-width="3"/><line x1="90" y1="150" x2="90" y2="190" stroke="#2563eb" stroke-width="3"/><line x1="170" y1="150" x2="170" y2="190" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 3"/>
<rect x="40" y="190" width="180" height="40" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="2"/><text x="130.0" y="215.0" text-anchor="middle" font-size="13">Réseau IPv4 et IPv6</text>
<line x1="90" y1="230" x2="90" y2="268" stroke="#2563eb" stroke-width="3"/><line x1="170" y1="230" x2="170" y2="268" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 3"/>
<rect x="40" y="268" width="180" height="60" rx="6" fill="#dcfce7" stroke="#14532d" stroke-width="2"/><text x="130.0" y="287.0" text-anchor="middle" font-size="12">Serveur</text><text x="130.0" y="303.0" text-anchor="middle" font-size="12">192.0.2.80</text><text x="130.0" y="319.0" text-anchor="middle" font-size="12">2001:db8::80</text>
<text x="130" y="360" text-anchor="middle" font-size="12">Deux protocoles en parallèle.</text><text x="130" y="378" text-anchor="middle" font-size="12">Le client essaie IPv6 en</text><text x="130" y="396" text-anchor="middle" font-size="12">priorité, repli sur IPv4.</text><text x="130" y="420" text-anchor="middle" font-size="12">Cas le plus courant.</text>
<rect x="310" y="90" width="180" height="50" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="400.0" y="112.0" text-anchor="middle" font-size="12">Îlot IPv6 A</text><text x="400.0" y="128.0" text-anchor="middle" font-size="12">2001:db8:a::/48</text>
<line x1="400" y1="140" x2="400" y2="168" stroke="#111" stroke-width="3"/>
<rect x="310" y="168" width="180" height="100" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="2"/><text x="400.0" y="199.0" text-anchor="middle" font-size="12">Internet IPv4 seul</text><text x="400.0" y="215.0" text-anchor="middle" font-size="12"></text><text x="400.0" y="231.0" text-anchor="middle" font-size="12">IPv6 emballé dans un</text><text x="400.0" y="247.0" text-anchor="middle" font-size="12">paquet IPv4</text>
<line x1="400" y1="268" x2="400" y2="296" stroke="#111" stroke-width="3"/>
<rect x="310" y="296" width="180" height="50" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="400.0" y="318.0" text-anchor="middle" font-size="12">Îlot IPv6 B</text><text x="400.0" y="334.0" text-anchor="middle" font-size="12">2001:db8:b::/48</text>
<text x="400" y="372" text-anchor="middle" font-size="12">Les extrémités encapsulent</text><text x="400" y="390" text-anchor="middle" font-size="12">l'IPv6 dans de l'IPv4</text><text x="400" y="408" text-anchor="middle" font-size="12">(protocole 41, ex. 6in4).</text><text x="400" y="428" text-anchor="middle" font-size="12">Solution de transition.</text>
<rect x="580" y="90" width="180" height="50" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="670.0" y="120.0" text-anchor="middle" font-size="13">Client IPv6 seul</text>
<line x1="670" y1="140" x2="670" y2="160" stroke="#111" stroke-width="3"/>
<rect x="580" y="160" width="180" height="40" rx="6" fill="#fce7f3" stroke="#831843" stroke-width="2"/><text x="670.0" y="185.0" text-anchor="middle" font-size="12">DNS64 : fabrique un AAAA</text>
<line x1="670" y1="200" x2="670" y2="222" stroke="#111" stroke-width="3"/>
<rect x="580" y="222" width="180" height="50" rx="6" fill="#fef9c3" stroke="#713f12" stroke-width="2"/><text x="670.0" y="244.0" text-anchor="middle" font-size="12">Passerelle NAT64</text><text x="670.0" y="260.0" text-anchor="middle" font-size="12">préfixe 64:ff9b::/96</text>
<line x1="670" y1="272" x2="670" y2="298" stroke="#111" stroke-width="3"/>
<rect x="580" y="298" width="180" height="48" rx="6" fill="#dcfce7" stroke="#14532d" stroke-width="2"/><text x="670.0" y="319.0" text-anchor="middle" font-size="12">Serveur IPv4 seul</text><text x="670.0" y="335.0" text-anchor="middle" font-size="12">192.0.2.80</text>
<text x="670" y="372" text-anchor="middle" font-size="12">Le client voit 64:ff9b::c000:250</text><text x="670" y="390" text-anchor="middle" font-size="12">(IPv4 intégré dans l'IPv6).</text><text x="670" y="408" text-anchor="middle" font-size="12">La passerelle traduit les paquets.</text><text x="670" y="428" text-anchor="middle" font-size="12">Pour réseaux IPv6 seul.</text>
<text x="400" y="460" text-anchor="middle" font-size="12">Création originale du projet Pack Master (CC0). Adresses de documentation RFC 5737 et RFC 3849.</text>
</g></svg>