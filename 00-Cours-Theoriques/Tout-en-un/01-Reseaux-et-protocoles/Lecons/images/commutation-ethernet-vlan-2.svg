<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
<title id="t">Structure d'une trame Ethernet avec étiquette 802.1Q</title>
<desc id="d">Trame Ethernet II : MAC destination 6 octets, MAC source 6 octets, étiquette 802.1Q de 4 octets contenant TPID 0x8100, PCP 3 bits, DEI 1 bit et VID 12 bits, puis EtherType 2 octets, données de 46 à 1500 octets, et FCS 4 octets.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b00020"/></marker></defs>
<rect width="800" height="330" fill="#ffffff"/>
<text x="400" y="35" font-family="sans-serif" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="bold">Trame Ethernet II avec étiquette 802.1Q</text>
<rect x="20" y="70" width="110" height="70" rx="2" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="75.0" y="100" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="bold">MAC dest.</text>
<text x="75.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">6 o</text>
<rect x="130" y="70" width="110" height="70" rx="2" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="185.0" y="100" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="bold">MAC source</text>
<text x="185.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">6 o</text>
<rect x="240" y="70" width="170" height="70" rx="2" fill="#ffe0b8" stroke="#1b2a41" stroke-width="2"/>
<text x="325.0" y="100" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle" font-weight="bold">Étiquette 802.1Q</text>
<text x="325.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">4 o</text>
<rect x="410" y="70" width="100" height="70" rx="2" fill="#e8ecf1" stroke="#1b2a41" stroke-width="2"/>
<text x="460.0" y="100" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="bold">EtherType</text>
<text x="460.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">2 o</text>
<rect x="510" y="70" width="190" height="70" rx="2" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="605.0" y="100" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle" font-weight="bold">Données</text>
<text x="605.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">46 à 1500 o</text>
<rect x="700" y="70" width="60" height="70" rx="2" fill="#e8ecf1" stroke="#1b2a41" stroke-width="2"/>
<text x="730.0" y="100" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="bold">FCS</text>
<text x="730.0" y="125" font-family="sans-serif" font-size="13" fill="#1b2a41" text-anchor="middle" font-weight="normal">4 o</text>
<line x1="250" y1="140" x2="60" y2="190" stroke="#1b2a41" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="420" y1="140" x2="740" y2="190" stroke="#1b2a41" stroke-width="2" stroke-dasharray="5 4"/>
<text x="400" y="175" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="normal">détail de l'étiquette (32 bits)</text>
<rect x="60" y="200" width="170" height="80" rx="2" fill="#ffe0b8" stroke="#1b2a41" stroke-width="2"/>
<text x="145.0" y="232" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">TPID</text>
<text x="145.0" y="258" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">0x8100</text>
<rect x="230" y="200" width="90" height="80" rx="2" fill="#ffe0b8" stroke="#1b2a41" stroke-width="2"/>
<text x="275.0" y="232" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">PCP</text>
<text x="275.0" y="258" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">3 bits</text>
<rect x="320" y="200" width="70" height="80" rx="2" fill="#ffe0b8" stroke="#1b2a41" stroke-width="2"/>
<text x="355.0" y="232" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">DEI</text>
<text x="355.0" y="258" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">1 bit</text>
<rect x="390" y="200" width="330" height="80" rx="2" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="555.0" y="232" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">VID (numéro de VLAN)</text>
<text x="555.0" y="258" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">12 bits : 1 à 4094</text>
<text x="400" y="308" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">PCP = priorité (classe de service), DEI = éligible à l'abandon, VID = identifiant du VLAN</text>
</svg>
