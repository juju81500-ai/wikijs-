<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d">
  <title id="t">Établissement d'une connexion TCP en trois temps (SYN, SYN-ACK, ACK)</title>
  <desc id="d">Diagramme de séquence entre un client 192.0.2.10 et un serveur 198.51.100.20 : le client envoie SYN avec le numéro de séquence x, le serveur répond SYN-ACK avec y et l'accusé x+1, le client termine par ACK avec l'accusé y+1, puis les données peuvent circuler.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>
  <rect width="800" height="430" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="400" y="26" font-size="20" font-weight="bold" text-anchor="middle">Poignée de main TCP en trois temps</text>
    <rect x="60" y="44" width="200" height="50" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="160" y="66" text-anchor="middle" font-weight="bold">Client</text>
    <text x="160" y="84" text-anchor="middle" font-size="12">192.0.2.10 : port 49152</text>
    <rect x="540" y="44" width="200" height="50" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
    <text x="640" y="66" text-anchor="middle" font-weight="bold">Serveur</text>
    <text x="640" y="84" text-anchor="middle" font-size="12">198.51.100.20 : port 443</text>
    <line x1="160" y1="94" x2="160" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="640" y1="94" x2="640" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>

    <line x1="162" y1="162" x2="636" y2="182" stroke="#111111" stroke-width="3" marker-end="url(#fleche)"/>
    <text x="400" y="134" text-anchor="middle" font-weight="bold">1. SYN · seq = x</text>
    <text x="400" y="152" text-anchor="middle" font-size="12">« Je voudrais ouvrir une connexion »</text>

    <line x1="638" y1="252" x2="164" y2="272" stroke="#111111" stroke-width="3" marker-end="url(#fleche)"/>
    <text x="400" y="224" text-anchor="middle" font-weight="bold">2. SYN-ACK · seq = y · ack = x + 1</text>
    <text x="400" y="242" text-anchor="middle" font-size="12">« D'accord, et moi aussi je m'ouvre »</text>

    <line x1="162" y1="332" x2="636" y2="352" stroke="#111111" stroke-width="3" marker-end="url(#fleche)"/>
    <text x="400" y="304" text-anchor="middle" font-weight="bold">3. ACK · ack = y + 1</text>
    <text x="400" y="322" text-anchor="middle" font-size="12">« Bien reçu, nous pouvons échanger »</text>

    <text x="400" y="392" text-anchor="middle" font-size="13">État : ESTABLISHED des deux côtés — les données (par exemple TLS puis HTTP) circulent.</text>
    <text x="400" y="418" font-size="12" text-anchor="middle">Création originale du projet Pack Master (CC0). Adresses de documentation (RFC 5737).</text>
  </g>
</svg>
