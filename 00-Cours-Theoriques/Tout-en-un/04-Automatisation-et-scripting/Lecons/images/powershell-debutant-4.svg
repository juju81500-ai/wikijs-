<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
<title id="t">Politique d&#x27;exécution PowerShell : un garde-fou, pas une frontière de sécurité</title>
<desc id="d">Schéma : la politique d&#x27;exécution est évaluée avant le lancement d&#x27;un fichier de script. Elle bloque ou autorise, mais n&#x27;empêche pas de copier-coller des commandes dans la console.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="420" fill="#f7f9fc"/>
<text x="400" y="38" font-family="sans-serif" font-size="25" fill="#111111" text-anchor="middle" font-weight="bold">La politique d&#x27;exécution (ExecutionPolicy)</text>
<rect x="30" y="90" width="180" height="80" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="120.0" y="124.14999999999999" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Fichier .ps1</text>
<text x="120.0" y="148.45" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">à lancer</text>
<rect x="280" y="90" width="240" height="80" rx="8" fill="#fef9c3" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="124.47500000000001" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="bold">Politique d&#x27;exécution</text>
<text x="400.0" y="147.425" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">vérifie la règle</text>
<rect x="590" y="66" width="180" height="60" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="680.0" y="90.8" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">Autorisé</text>
<text x="680.0" y="112.4" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">script exécuté</text>
<rect x="590" y="150" width="180" height="60" rx="8" fill="#fee2e2" stroke="#1b2a41" stroke-width="2"/>
<text x="680.0" y="174.79999999999998" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">Refusé</text>
<text x="680.0" y="196.39999999999998" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">message d&#x27;erreur</text>
<line x1="210" y1="130" x2="280" y2="130" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="520" y1="115" x2="590" y2="96" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="520" y1="145" x2="590" y2="180" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="230" width="740" height="160" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="262" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Valeurs usuelles (du plus strict au plus souple)</text>
<text x="60" y="295" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="start">Restricted : aucun script, commandes interactives seulement</text>
<text x="60" y="323" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="start">AllSigned : scripts signés uniquement</text>
<text x="60" y="351" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="start">RemoteSigned : scripts téléchargés doivent être signés</text>
<text x="60" y="379" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="start">Unrestricted / Bypass : peu ou pas de contrôle (à éviter)</text>
</svg>
