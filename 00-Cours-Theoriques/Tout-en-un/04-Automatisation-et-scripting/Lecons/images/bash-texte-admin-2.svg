<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<title>Le motif « top N » : six étapes</title>
<desc>grep écarte les lignes sans erreur, cut garde l'adresse, sort rapproche, uniq -c compte, sort -rn classe, head garde les premières.</desc>
<defs><marker id="a1b2a41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="500" fill="#ffffff"/>
<text xml:space="preserve" x="400" y="34" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">Quelles adresses provoquent le plus d'erreurs ?</text>
<rect x="30" y="58" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="89" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">grep -v -E '" [23][0-9]{2} '</text>
<text xml:space="preserve" x="420" y="89" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">écarte les réponses 2xx et 3xx</text>
<line x1="215" y1="108" x2="215" y2="130" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="30" y="130" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="161" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">cut -d' ' -f1</text>
<text xml:space="preserve" x="420" y="161" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">garde la 1re colonne : l'adresse</text>
<line x1="215" y1="180" x2="215" y2="202" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="30" y="202" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="233" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">sort</text>
<text xml:space="preserve" x="420" y="233" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">rapproche les adresses identiques</text>
<line x1="215" y1="252" x2="215" y2="274" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="30" y="274" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="305" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">uniq -c</text>
<text xml:space="preserve" x="420" y="305" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">compte chaque groupe</text>
<line x1="215" y1="324" x2="215" y2="346" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="30" y="346" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="377" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">sort -rn</text>
<text xml:space="preserve" x="420" y="377" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">classe du plus grand au plus petit</text>
<line x1="215" y1="396" x2="215" y2="418" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="30" y="418" width="370" height="50" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="45" y="449" font-family="monospace" font-size="15" font-weight="normal" fill="#111111" text-anchor="start">head -n 2</text>
<text xml:space="preserve" x="420" y="449" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="start">garde les deux premières lignes</text>
<text xml:space="preserve" x="400" y="492" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Résultat : 3 203.0.113.7  puis  2 198.51.100.23</text>
</svg>
