<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
<title id="t">Architecture Ansible : un contrôleur, un inventaire, des hôtes gérés</title>
<desc id="d">Schéma : le nœud de contrôle lit l&#x27;inventaire et les playbooks puis se connecte en SSH aux hôtes gérés des groupes web et bdd, sans agent à installer.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="420" fill="#f7f9fc"/>
<text x="400" y="34" font-family="sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="bold">Ansible : approche sans agent</text>
<rect x="20" y="80" width="250" height="230" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="145.0" y="146.6" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">Nœud de contrôle</text>
<text x="145.0" y="168.2" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle"></text>
<text x="145.0" y="189.8" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">inventory.yml</text>
<text x="145.0" y="211.4" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">playbook.yml</text>
<text x="145.0" y="233.0" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">ansible.cfg</text>
<text x="145.0" y="254.6" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">coffre (Vault)</text>
<rect x="560" y="70" width="220" height="90" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="670.0" y="100.0" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">Groupe web</text>
<text x="670.0" y="120.25" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">192.0.2.11</text>
<text x="670.0" y="140.5" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">192.0.2.12</text>
<rect x="560" y="190" width="220" height="90" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="670.0" y="230.125" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">Groupe bdd</text>
<text x="670.0" y="250.375" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">192.0.2.21</text>
<rect x="560" y="310" width="220" height="70" rx="8" fill="#e5e7eb" stroke="#1b2a41" stroke-width="2" stroke-dasharray="8 5"/>
<text x="670.0" y="340.125" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">Hôte hors périmètre</text>
<text x="670.0" y="360.375" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">(non listé)</text>
<line x1="270" y1="150" x2="560" y2="115" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="415" y="118" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">SSH</text>
<line x1="270" y1="215" x2="560" y2="235" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="415" y="240" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">SSH</text>
<text x="145" y="350" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">Modules poussés puis retirés.</text>
</svg>
