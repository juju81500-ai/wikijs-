<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">Branches Git : travailler sans toucher à la branche principale</title>
<desc id="d">Schéma : la branche main contient quatre commits ; une branche correction-spooler part du deuxième commit, reçoit deux commits puis est fusionnée dans main.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="360" fill="#f7f9fc"/>
<text x="400" y="34" font-family="sans-serif" font-size="25" fill="#111111" text-anchor="middle" font-weight="bold">Branche de travail puis fusion</text>
<text x="40" y="120" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="start" font-weight="bold">main</text>
<text x="40" y="250" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="start" font-weight="bold">correction</text>
<line x1="170" y1="120" x2="240" y2="120" stroke="#1b2a41" stroke-width="3"/>
<line x1="280" y1="120" x2="350" y2="120" stroke="#1b2a41" stroke-width="3"/>
<line x1="390" y1="120" x2="600" y2="120" stroke="#1b2a41" stroke-width="3"/>
<line x1="640" y1="120" x2="700" y2="120" stroke="#1b2a41" stroke-width="3"/>
<circle cx="150" cy="120" r="20" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="150" y="125" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">A</text>
<circle cx="260" cy="120" r="20" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="260" y="125" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">B</text>
<circle cx="370" cy="120" r="20" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="370" y="125" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">C</text>
<circle cx="620" cy="120" r="20" fill="#ede9fe" stroke="#1b2a41" stroke-width="2"/>
<text x="620" y="125" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">F</text>
<circle cx="720" cy="120" r="20" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="720" y="125" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">G</text>
<line x1="270" y1="136" x2="355" y2="236" stroke="#1b2a41" stroke-width="3"/>
<line x1="375" y1="250" x2="475" y2="250" stroke="#1b2a41" stroke-width="3"/>
<line x1="495" y1="250" x2="620" y2="250" stroke="#1b2a41" stroke-width="3"/>
<line x1="620" y1="244" x2="620" y2="140" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<circle cx="370" cy="250" r="20" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="370" y="255" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">D</text>
<circle cx="480" cy="250" r="20" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="480" y="255" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">E</text>
<text x="620" y="215" font-family="sans-serif" font-size="15" fill="#6d28d9" text-anchor="start">fusion</text>
<text x="400" y="325" font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">A, B, C… = commits ; F est le commit de fusion ; on teste sur la branche avant de fusionner.</text>
</svg>
