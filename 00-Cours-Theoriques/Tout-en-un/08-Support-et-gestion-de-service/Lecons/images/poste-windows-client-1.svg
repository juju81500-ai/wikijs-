<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="t d">
<title id="t">Séquence de démarrage de Windows et pannes typiques</title>
<desc id="d">Cinq étapes du démarrage : firmware UEFI, gestionnaire de démarrage, chargement du noyau et des pilotes, services et ouverture de session, bureau. Sous chaque étape figure un symptôme typique.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="820" height="430" fill="#ffffff"/>
<text x="410" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#111111">Démarrage d&#x27;un poste Windows : où cela casse</text>
<rect x="20" y="70" width="140" height="80" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
<text x="90.0" y="105.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">1. Firmware</text>
<text x="90.0" y="124.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">UEFI / POST</text>
<rect x="20" y="220" width="140" height="80" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="90.0" y="256.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Écran noir,</text>
<text x="90.0" y="273.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">pas de POST</text>
<path d="M90,150 L90,220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M160,110 L180,110" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="180" y="70" width="140" height="80" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
<text x="250.0" y="105.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">2. Gestionnaire</text>
<text x="250.0" y="124.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">de démarrage</text>
<rect x="180" y="220" width="140" height="80" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="250.0" y="256.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">BCD absent,</text>
<text x="250.0" y="273.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">démarrage refusé</text>
<path d="M250,150 L250,220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M320,110 L340,110" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="70" width="140" height="80" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
<text x="410.0" y="105.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">3. Noyau</text>
<text x="410.0" y="124.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">et pilotes</text>
<rect x="340" y="220" width="140" height="80" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="410.0" y="256.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Écran bleu,</text>
<text x="410.0" y="273.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">boucle réparation</text>
<path d="M410,150 L410,220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M480,110 L500,110" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="70" width="140" height="80" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
<text x="570.0" y="105.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">4. Services</text>
<text x="570.0" y="124.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">et session</text>
<rect x="500" y="220" width="140" height="80" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="570.0" y="256.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Démarrage long,</text>
<text x="570.0" y="273.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">profil temporaire</text>
<path d="M570,150 L570,220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<path d="M640,110 L660,110" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="660" y="70" width="140" height="80" rx="10" fill="#e8f1fb" stroke="#1f4e8c" stroke-width="2"/>
<text x="730.0" y="105.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">5. Bureau</text>
<text x="730.0" y="124.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#111111">(shell)</text>
<rect x="660" y="220" width="140" height="80" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="730.0" y="256.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Icônes absentes,</text>
<text x="730.0" y="273.05" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">bureau lent</text>
<path d="M730,150 L730,220" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="410" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Outils : journaux d&#x27;événements, mode sans échec, WinRE, msconfig</text>
<text x="410" y="368" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Règle : localiser l&#x27;étape qui échoue avant de réparer</text>
<text x="410" y="396" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">(un écran bleu ne se traite pas comme un profil corrompu)</text>
</svg>
