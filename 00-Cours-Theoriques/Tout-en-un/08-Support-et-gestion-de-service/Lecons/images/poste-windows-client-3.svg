<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-labelledby="t d">
<title id="t">Parcours de prise en main à distance avec consentement</title>
<desc id="d">Cinq étapes : demande, information et accord de l&#x27;utilisateur, connexion visible, actions limitées au besoin, fin de session et trace dans le ticket. Sans accord, la session ne démarre pas.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect width="820" height="380" fill="#ffffff"/>
<text x="410" y="30" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#111111">Prise en main à distance : le consentement d&#x27;abord</text>
<rect x="20" y="70" width="140" height="90" rx="10" fill="#e3f5e6" stroke="#1d6b2f" stroke-width="2"/>
<text x="90.0" y="110.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">1. Demande</text>
<text x="90.0" y="128.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">ticket + motif</text>
<path d="M160,115 L180,115" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="180" y="70" width="140" height="90" rx="10" fill="#e3f5e6" stroke="#1d6b2f" stroke-width="2"/>
<text x="250.0" y="101.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">2. Information</text>
<text x="250.0" y="119.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">ce qui sera vu</text>
<text x="250.0" y="137.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">et fait</text>
<path d="M320,115 L340,115" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="340" y="70" width="140" height="90" rx="10" fill="#fff4d6" stroke="#8a5a00" stroke-width="2"/>
<text x="410.0" y="101.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">3. Accord</text>
<text x="410.0" y="119.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">explicite de</text>
<text x="410.0" y="137.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">l&#x27;utilisateur</text>
<path d="M480,115 L500,115" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="70" width="140" height="90" rx="10" fill="#e3f5e6" stroke="#1d6b2f" stroke-width="2"/>
<text x="570.0" y="101.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">4. Session</text>
<text x="570.0" y="119.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">bandeau visible,</text>
<text x="570.0" y="137.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">actions limitées</text>
<path d="M640,115 L660,115" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<rect x="660" y="70" width="140" height="90" rx="10" fill="#e3f5e6" stroke="#1d6b2f" stroke-width="2"/>
<text x="730.0" y="101.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">5. Clôture</text>
<text x="730.0" y="119.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">déconnexion,</text>
<text x="730.0" y="137.9" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">trace au ticket</text>
<rect x="300" y="230" width="220" height="70" rx="10" fill="#fde8e8" stroke="#9b1c1c" stroke-width="2"/>
<text x="410.0" y="261.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111111">Refus ou absence de réponse :</text>
<text x="410.0" y="277.2" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#111111">on ne se connecte pas</text>
<path d="M410,160 L410,230" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
<text x="420" y="200" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#222222">non</text>
<text x="410" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Utilisateur absent ou session sensible : procédure dédiée, jamais en cachette</text>
</svg>
