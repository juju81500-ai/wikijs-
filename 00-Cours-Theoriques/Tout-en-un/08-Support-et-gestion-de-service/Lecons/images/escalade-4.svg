<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Indicateurs de support et formules</title>
<desc id="d">Cinq indicateurs avec leur définition et leur formule : MTTA, MTTR, FCR, respect des SLA, réouvertures.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">Quelques indicateurs de support</tspan></text>
<rect x="30" y="60" width="140" height="52" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="100" y="92" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="100" dy="0">MTTA</tspan></text>
<rect x="180" y="60" width="590" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="195" y="82" font-size="14" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="195" dy="0">Délai moyen avant prise en charge</tspan></text>
<text x="195" y="102" font-size="13" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="195" dy="0">somme des délais / nombre de tickets</tspan></text>
<rect x="30" y="126" width="140" height="52" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="100" y="158" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="100" dy="0">MTTR</tspan></text>
<rect x="180" y="126" width="590" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="195" y="148" font-size="14" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="195" dy="0">Délai moyen de résolution</tspan></text>
<text x="195" y="168" font-size="13" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="195" dy="0">somme des durées / nombre de tickets</tspan></text>
<rect x="30" y="192" width="140" height="52" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="100" y="224" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="100" dy="0">FCR</tspan></text>
<rect x="180" y="192" width="590" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="195" y="214" font-size="14" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="195" dy="0">Résolution au premier contact</tspan></text>
<text x="195" y="234" font-size="13" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="195" dy="0">tickets résolus en N1 / tickets reçus</tspan></text>
<rect x="30" y="258" width="140" height="52" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="100" y="290" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="100" dy="0">Taux de respect SLA</tspan></text>
<rect x="180" y="258" width="590" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="195" y="280" font-size="14" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="195" dy="0">Tickets dans les délais</tspan></text>
<text x="195" y="300" font-size="13" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="195" dy="0">tickets dans la cible / tickets clôturés</tspan></text>
<rect x="30" y="324" width="140" height="52" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="100" y="356" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="100" dy="0">Réouvertures</tspan></text>
<rect x="180" y="324" width="590" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="195" y="346" font-size="14" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="195" dy="0">Qualité de la résolution</tspan></text>
<text x="195" y="366" font-size="13" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="195" dy="0">tickets rouverts / tickets résolus</tspan></text>
<text x="400" y="415" font-size="14" text-anchor="middle" font-weight="bold" fill="#34495e"><tspan x="400" dy="0">Un indicateur sert à décider quelque chose : sinon, ne le suivez pas.</tspan></text>

</svg>
