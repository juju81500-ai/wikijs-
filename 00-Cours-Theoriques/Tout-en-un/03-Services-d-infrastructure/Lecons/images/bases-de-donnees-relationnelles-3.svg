<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Cycle de la sauvegarde logique d'une base</title>
<desc>Quatre étapes en boucle : exporter la base avec mysqldump ou pg_dump, compresser et vérifier le fichier, copier hors du serveur, puis tester régulièrement la restauration sur une base jetable.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="330" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Sauvegarde logique : exporter, protéger, copier, restaurer pour tester</text>
<rect x="20" y="90" width="165" height="110" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="102.5" y="130.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">1. Exporter</text>
<text x="102.5" y="150.25" text-anchor="middle" font-size="15" fill="#111111">mysqldump</text>
<text x="102.5" y="170.25" text-anchor="middle" font-size="15" fill="#111111">pg_dump</text>
<line x1="187" y1="145" x2="213" y2="145" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="215" y="90" width="165" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="297.5" y="130.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">2. Compresser</text>
<text x="297.5" y="150.25" text-anchor="middle" font-size="15" fill="#111111">gzip + somme</text>
<text x="297.5" y="170.25" text-anchor="middle" font-size="15" fill="#111111">de contrôle</text>
<line x1="382" y1="145" x2="408" y2="145" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="410" y="90" width="165" height="110" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="492.5" y="130.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">3. Copier ailleurs</text>
<text x="492.5" y="150.25" text-anchor="middle" font-size="15" fill="#111111">autre machine</text>
<text x="492.5" y="170.25" text-anchor="middle" font-size="15" fill="#111111">droits 600</text>
<line x1="577" y1="145" x2="603" y2="145" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="605" y="90" width="165" height="110" rx="8" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
<text x="687.5" y="130.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">4. Tester</text>
<text x="687.5" y="150.25" text-anchor="middle" font-size="15" fill="#111111">restauration sur</text>
<text x="687.5" y="170.25" text-anchor="middle" font-size="15" fill="#111111">base jetable</text>
<line x1="700" y1="202" x2="700" y2="255" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="700" y1="257" x2="100" y2="257" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="100" y1="257" x2="100" y2="202" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="248" text-anchor="middle" font-size="14" fill="#111111">on recommence à chaque sauvegarde planifiée</text>
<rect x="20" y="285" width="760" height="35" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400.0" y="307.4" text-anchor="middle" font-size="14" fill="#111111">Une sauvegarde jamais restaurée n'est qu'une hypothèse</text>
</svg>
