<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Autorité de certification interne : racine, intermédiaire, certificat serveur</title>
<desc>La CA racine, hors ligne, signe le certificat de la CA intermédiaire. L'intermédiaire signe les certificats des serveurs à partir d'une demande de signature CSR. Le serveur présente son certificat et celui de l'intermédiaire ; le client ne fait confiance qu'à la racine installée dans son magasin.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">PKI interne : qui signe qui ?</text>
<rect x="280" y="50" width="240" height="70" rx="8" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
<text x="400.0" y="80.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">CA racine (hors ligne)</text>
<text x="400.0" y="100.25" text-anchor="middle" font-size="15" fill="#111111">Interne Example Root CA</text>
<rect x="280" y="170" width="240" height="70" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="400.0" y="200.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">CA intermédiaire</text>
<text x="400.0" y="220.25" text-anchor="middle" font-size="15" fill="#111111">Interne Example Issuing CA</text>
<rect x="280" y="290" width="240" height="70" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="400.0" y="320.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Certificat serveur</text>
<text x="400.0" y="340.25" text-anchor="middle" font-size="15" fill="#111111">www.example.com</text>
<line x1="400" y1="122" x2="400" y2="168" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="430" y="150" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">signe</text>
<line x1="400" y1="242" x2="400" y2="288" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="430" y="270" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">signe</text>
<rect x="10" y="290" width="170" height="70" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="95.0" y="320.25" text-anchor="middle" font-size="15" fill="#111111">Serveur web</text>
<text x="95.0" y="340.25" text-anchor="middle" font-size="15" fill="#111111">clé privée + CSR</text>
<line x1="182" y1="315" x2="278" y2="315" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="230" y="305" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">1. CSR</text>
<line x1="278" y1="342" x2="182" y2="342" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="230" y="368" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">2. certificat</text>
<rect x="570" y="50" width="210" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="675.0" y="80.25" text-anchor="middle" font-size="15" fill="#111111">Magasin du client</text>
<text x="675.0" y="100.25" text-anchor="middle" font-size="15" fill="#111111">contient la racine</text>
<line x1="568" y1="85" x2="522" y2="85" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="545" y="45" text-anchor="middle" font-size="13" fill="#111111">confiance</text>
<rect x="570" y="200" width="210" height="100" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="675.0" y="235.9" text-anchor="middle" font-size="14" fill="#111111">Le serveur présente</text>
<text x="675.0" y="254.9" text-anchor="middle" font-size="14" fill="#111111">sa chaîne : feuille +</text>
<text x="675.0" y="273.9" text-anchor="middle" font-size="14" fill="#111111">intermédiaire</text>
<rect x="20" y="400" width="760" height="32" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400.0" y="420.9" text-anchor="middle" font-size="14" fill="#111111">La clé privée ne quitte jamais le serveur : seule la CSR circule</text>
</svg>
