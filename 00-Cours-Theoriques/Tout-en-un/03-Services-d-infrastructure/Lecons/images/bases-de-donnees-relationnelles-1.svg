<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Deux tables reliées par une clé étrangère</title>
<desc>La table clients contient id, nom et ville avec id comme clé primaire. La table commandes contient id, client_id et montant. La colonne client_id de commandes est une clé étrangère qui référence clients.id. Une jointure SQL associe les lignes ayant le même identifiant.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Modèle relationnel : clé primaire, clé étrangère, jointure</text>
<rect x="30" y="70" width="290" height="124" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
<rect x="30" y="70" width="290" height="34" fill="#1e3a8a"/>
<text x="175.0" y="93" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">clients</text>
<text x="40" y="125" text-anchor="start" font-size="14" fill="#111111">id</text>
<text x="310" y="125" text-anchor="end" font-size="14" fill="#14532d">PK INTEGER</text>
<line x1="30" y1="134" x2="320" y2="134" stroke="#9ca3af"/>
<text x="40" y="155" text-anchor="start" font-size="14" fill="#111111">nom</text>
<text x="310" y="155" text-anchor="end" font-size="14" fill="#111111">VARCHAR(80)</text>
<line x1="30" y1="164" x2="320" y2="164" stroke="#9ca3af"/>
<text x="40" y="185" text-anchor="start" font-size="14" fill="#111111">ville</text>
<text x="310" y="185" text-anchor="end" font-size="14" fill="#111111">VARCHAR(60)</text>
<line x1="30" y1="194" x2="320" y2="194" stroke="#9ca3af"/>
<rect x="480" y="70" width="290" height="124" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
<rect x="480" y="70" width="290" height="34" fill="#1e3a8a"/>
<text x="625.0" y="93" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">commandes</text>
<text x="490" y="125" text-anchor="start" font-size="14" fill="#111111">id</text>
<text x="760" y="125" text-anchor="end" font-size="14" fill="#14532d">PK INTEGER</text>
<line x1="480" y1="134" x2="770" y2="134" stroke="#9ca3af"/>
<text x="490" y="155" text-anchor="start" font-size="14" fill="#111111">client_id</text>
<text x="760" y="155" text-anchor="end" font-size="14" fill="#9a3412">FK → clients.id</text>
<line x1="480" y1="164" x2="770" y2="164" stroke="#9ca3af"/>
<text x="490" y="185" text-anchor="start" font-size="14" fill="#111111">montant</text>
<text x="760" y="185" text-anchor="end" font-size="14" fill="#111111">DECIMAL(10,2)</text>
<line x1="480" y1="194" x2="770" y2="194" stroke="#9ca3af"/>
<line x1="322" y1="185" x2="478" y2="185" stroke="#9a3412" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="400" y="175" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">client_id = id</text>
<rect x="30" y="240" width="740" height="130" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="400.0" y="280.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Requête de jointure</text>
<text x="400.0" y="300.25" text-anchor="middle" font-size="15" fill="#111111">SELECT c.nom, o.montant FROM clients c</text>
<text x="400.0" y="320.25" text-anchor="middle" font-size="15" fill="#111111">JOIN commandes o ON o.client_id = c.id WHERE c.ville = 'Lyon';</text>
<text x="400.0" y="340.25" text-anchor="middle" font-size="15" fill="#111111">La clé étrangère interdit une commande dont le client n'existe pas.</text>
</svg>
