<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Schéma d'un proxy inverse devant deux serveurs d'application</title>
<desc>Un navigateur envoie une requête HTTPS vers le proxy inverse Nginx à l'adresse 203.0.113.10. Le proxy termine TLS puis relaie la requête en HTTP vers deux serveurs d'application internes, 192.0.2.11 et 192.0.2.12, et renvoie les réponses au client.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Proxy inverse : un seul point d'entrée, plusieurs serveurs derrière</text>
<rect x="20" y="160" width="150" height="100" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="95.0" y="205.1" text-anchor="middle" font-size="16" fill="#111111">Navigateur</text>
<text x="95.0" y="226.1" text-anchor="middle" font-size="16" fill="#111111">(client)</text>
<rect x="300" y="110" width="200" height="200" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="400.0" y="185.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Nginx</text>
<text x="400.0" y="205.25" text-anchor="middle" font-size="15" fill="#111111">reverse proxy</text>
<text x="400.0" y="225.25" text-anchor="middle" font-size="15" fill="#111111">203.0.113.10:443</text>
<text x="400.0" y="245.25" text-anchor="middle" font-size="15" fill="#111111">termine TLS</text>
<rect x="600" y="70" width="180" height="90" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="690.0" y="110.1" text-anchor="middle" font-size="16" fill="#111111">app1</text>
<text x="690.0" y="131.1" text-anchor="middle" font-size="16" fill="#111111">192.0.2.11:8080</text>
<rect x="600" y="240" width="180" height="90" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="690.0" y="280.1" text-anchor="middle" font-size="16" fill="#111111">app2</text>
<text x="690.0" y="301.1" text-anchor="middle" font-size="16" fill="#111111">192.0.2.12:8080</text>
<line x1="170" y1="210" x2="298" y2="210" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="234" y="198" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">HTTPS</text>
<line x1="502" y1="170" x2="598" y2="125" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="552" y="133" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">HTTP</text>
<line x1="502" y1="230" x2="598" y2="275" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="552" y="272" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">HTTP</text>
<text x="400" y="345" text-anchor="middle" font-size="14" fill="#111111">Le proxy ajoute X-Forwarded-For, X-Forwarded-Proto et Host</text>
<rect x="20" y="362" width="760" height="46" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400.0" y="389.9" text-anchor="middle" font-size="14" fill="#111111">Zone publique à gauche · zone privée à droite (les applications ne sont pas exposées directement)</text>
</svg>
