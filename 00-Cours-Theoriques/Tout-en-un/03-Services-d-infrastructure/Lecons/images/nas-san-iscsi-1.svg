<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
<title id="t">NAS et SAN : le client voit un dossier partagé ou un disque brut</title>
<desc id="d">À gauche, un NAS expose des fichiers via SMB ou NFS : le NAS gère le système de fichiers. À droite, une baie SAN expose des LUN en mode bloc via iSCSI ou Fibre Channel : le serveur client formate et gère le système de fichiers.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect width="800" height="480" fill="#ffffff"/>
<text x="200" y="30" text-anchor="middle" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">NAS (niveau fichier)</text>
<text x="600" y="30" text-anchor="middle" font-size="19" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">SAN (niveau bloc)</text>
<line x1="400" y1="50" x2="400" y2="435" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="6 4"/>
<rect x="40" y="70" width="320" height="60" rx="8" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
<text x="200.0" y="95.4" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Client : voit un DOSSIER</text>
<text x="200.0" y="114.4" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">\\nas\partage ou /mnt/nas</text>
<rect x="40" y="160" width="320" height="40" rx="8" fill="#fff3a8" stroke="#1a1a1a" stroke-width="2"/>
<text x="200.0" y="184.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">SMB / NFS (Ethernet)</text>
<rect x="40" y="230" width="320" height="110" rx="8" fill="#d4f2d4" stroke="#1a1a1a" stroke-width="2"/>
<text x="200.0" y="270.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Équipement NAS</text>
<text x="200.0" y="289.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">gère le système de fichiers,</text>
<text x="200.0" y="308.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">les droits et les quotas</text>
<rect x="40" y="370" width="320" height="50" rx="8" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/>
<text x="200.0" y="399.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Disques / RAID internes</text>
<line x1="200" y1="130" x2="200" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="200" y1="200" x2="200" y2="230" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="200" y1="340" x2="200" y2="370" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="440" y="70" width="320" height="60" rx="8" fill="#ffe2b8" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="95.4" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Serveur : voit un DISQUE</text>
<text x="600.0" y="114.4" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">/dev/sdb (une LUN)</text>
<rect x="440" y="160" width="320" height="40" rx="8" fill="#fff3a8" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="184.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">iSCSI / Fibre Channel</text>
<rect x="440" y="230" width="320" height="110" rx="8" fill="#d4f2d4" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="270.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Baie SAN</text>
<text x="600.0" y="289.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">présente des LUN brutes</text>
<text x="600.0" y="308.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">sans connaître les fichiers</text>
<rect x="440" y="370" width="320" height="50" rx="8" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/>
<text x="600.0" y="399.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Pools de disques / RAID</text>
<line x1="600" y1="130" x2="600" y2="160" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="600" y1="200" x2="600" y2="230" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="600" y1="340" x2="600" y2="370" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="468" text-anchor="middle" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Le serveur SAN crée lui-même le système de fichiers (ext4, XFS, NTFS, VMFS…).</text>
</svg>
