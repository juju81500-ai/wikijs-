<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">Les trois commandes de découverte de PowerShell</title>
<desc id="d">Schéma : Get-Command trouve une commande, Get-Help explique comment l&#x27;utiliser, Get-Member révèle les propriétés des objets produits.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="380" fill="#f7f9fc"/>
<text x="400" y="40" font-family="sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="bold">Trouver, comprendre, inspecter</text>
<rect x="15" y="80" width="235" height="150" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="132.5" y="141.0" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold">1. Get-Command</text>
<text x="132.5" y="159.9" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">« Quelle commande existe ? »</text>
<text x="132.5" y="178.8" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">Get-Command *Service*</text>
<rect x="285" y="80" width="235" height="150" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="402.5" y="141.0" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold">2. Get-Help</text>
<text x="402.5" y="159.9" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">« Comment l&#x27;utiliser ? »</text>
<text x="402.5" y="178.8" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">Get-Help Get-Service -Examples</text>
<rect x="555" y="80" width="235" height="150" rx="8" fill="#fef9c3" stroke="#1b2a41" stroke-width="2"/>
<text x="672.5" y="141.0" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle" font-weight="bold">3. Get-Member</text>
<text x="672.5" y="159.9" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">« Que contient l&#x27;objet ? »</text>
<text x="672.5" y="178.8" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">Get-Service | Get-Member</text>
<line x1="250" y1="155" x2="285" y2="155" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="520" y1="155" x2="555" y2="155" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="265" width="680" height="80" rx="8" fill="#ffffff" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="298" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">Démarche : chercher le verbe-nom, lire les exemples,</text>
<text x="400" y="326" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">puis inspecter les propriétés avant de filtrer ou de trier.</text>
</svg>
