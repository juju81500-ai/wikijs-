<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d">
<title id="t">Anatomie d&#x27;une cmdlet PowerShell : Verbe-Nom</title>
<desc id="d">Schéma : Get-Service -Name Spooler se décompose en un verbe (Get), un nom (Service) et un paramètre avec sa valeur.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="360" fill="#f7f9fc"/>
<text x="400" y="45" font-family="sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="bold">Anatomie d&#x27;une commande PowerShell</text>
<rect x="40" y="90" width="170" height="80" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="125.0" y="124.14999999999999" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Verbe</text>
<text x="125.0" y="148.45" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle">Get</text>
<text x="225" y="142" font-family="sans-serif" font-size="34" fill="#111111" text-anchor="middle" font-weight="bold">-</text>
<rect x="240" y="90" width="200" height="80" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="340.0" y="124.14999999999999" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Nom (objet visé)</text>
<text x="340.0" y="148.45" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle">Service</text>
<rect x="470" y="90" width="130" height="80" rx="8" fill="#fef9c3" stroke="#1b2a41" stroke-width="2"/>
<text x="535.0" y="124.14999999999999" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Paramètre</text>
<text x="535.0" y="148.45" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle">-Name</text>
<rect x="620" y="90" width="150" height="80" rx="8" fill="#ede9fe" stroke="#1b2a41" stroke-width="2"/>
<text x="695.0" y="124.14999999999999" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">Valeur</text>
<text x="695.0" y="148.45" font-family="monospace" font-size="18" fill="#111111" text-anchor="middle">Spooler</text>
<line x1="125" y1="175" x2="125" y2="235" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="125" y="262" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">ce que l&#x27;on fait</text>
<line x1="340" y1="175" x2="340" y2="235" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="340" y="262" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">sur quoi on agit</text>
<line x1="535" y1="175" x2="535" y2="235" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="535" y="262" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">le paramètre</text>
<line x1="695" y1="175" x2="695" y2="235" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="695" y="262" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">sa valeur</text>
<text x="400" y="320" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">Verbes courants : Get (lire), Set (modifier), New (créer), Remove (supprimer), Start / Stop</text>
</svg>
