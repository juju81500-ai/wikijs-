<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Pile SSSD sur un serveur Linux joint à un annuaire</title>
  <desc id="d">Les programmes (login, sshd, sudo) appellent PAM pour l'authentification et NSS pour la résolution des noms. Les deux s'appuient sur le démon sssd, qui interroge l'annuaire LDAP à ldaps://ldap.example.com et garde un cache local pour continuer à fonctionner si le réseau est coupé.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">SSSD : le traducteur entre Linux et l'annuaire</text>
  <g font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">
    <rect x="20" y="55" width="760" height="60" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <text x="400" y="80" font-weight="bold">Programmes : login, sshd, sudo, su, id, ls -l</text>
    <text x="400" y="102">« Qui est ce compte ? » et « Son secret est-il bon ? »</text>

    <rect x="130" y="150" width="220" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="240" y="176" font-weight="bold">NSS (nsswitch.conf)</text>
    <text x="240" y="196">identité : UID, GID</text>
    <rect x="450" y="150" width="220" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="560" y="176" font-weight="bold">PAM (pam.d)</text>
    <text x="560" y="196">authentification, session</text>

    <rect x="260" y="245" width="280" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="400" y="271" font-weight="bold">Démon sssd + cache local</text>
    <text x="400" y="291">/var/lib/sss/db (hors ligne OK)</text>

    <rect x="560" y="320" width="220" height="60" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
    <text x="670" y="346" font-weight="bold">Annuaire LDAP</text>
    <text x="670" y="366">ldaps://ldap.example.com</text>
  </g>
  <g stroke="#111111" stroke-width="2.5" marker-end="url(#a)">
    <line x1="240" y1="115" x2="240" y2="148"/>
    <line x1="560" y1="115" x2="560" y2="148"/>
    <line x1="270" y1="210" x2="340" y2="243"/>
    <line x1="530" y1="210" x2="460" y2="243"/>
    <line x1="500" y1="305" x2="600" y2="318"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#111111">
    <text x="20" y="350">Étapes de diagnostic :</text>
    <text x="20" y="372">getent passwd alice → sssctl domain-status → journalctl -u sssd</text>
  </g>
</svg>
