<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Anatomie d'une ligne du fichier /etc/passwd</title>
  <desc id="d">La ligne alice:x:1001:1001:Alice Exemple:/home/alice:/bin/bash est découpée en sept champs séparés par des deux-points : nom de connexion, mot de passe (x = déporté dans shadow), UID, GID principal, commentaire GECOS, répertoire personnel et shell.</desc>
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">Une ligne de /etc/passwd = 7 champs</text>
  <rect x="20" y="55" width="760" height="50" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-family="monospace" font-size="21" fill="#0f172a">alice:x:1001:1001:Alice Exemple:/home/alice:/bin/bash</text>
  <g font-family="sans-serif" font-size="15" fill="#111111">
    <line x1="60" y1="105" x2="60" y2="140" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="20" y="140" width="100" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="70" y="162" text-anchor="middle" font-weight="bold">1. Nom</text>
    <text x="70" y="182" text-anchor="middle">de connexion</text>

    <line x1="118" y1="105" x2="188" y2="140" stroke="#b45309" stroke-width="2"/>
    <rect x="128" y="140" width="100" height="62" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="178" y="162" text-anchor="middle" font-weight="bold">2. Mot de</text>
    <text x="178" y="182" text-anchor="middle">passe : « x »</text>

    <line x1="165" y1="105" x2="290" y2="140" stroke="#15803d" stroke-width="2"/>
    <rect x="236" y="140" width="100" height="62" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="286" y="162" text-anchor="middle" font-weight="bold">3. UID</text>
    <text x="286" y="182" text-anchor="middle">numérique</text>

    <line x1="205" y1="105" x2="395" y2="140" stroke="#7e22ce" stroke-width="2"/>
    <rect x="344" y="140" width="100" height="62" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="394" y="162" text-anchor="middle" font-weight="bold">4. GID</text>
    <text x="394" y="182" text-anchor="middle">principal</text>

    <line x1="300" y1="105" x2="502" y2="140" stroke="#be123c" stroke-width="2"/>
    <rect x="452" y="140" width="100" height="62" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
    <text x="502" y="162" text-anchor="middle" font-weight="bold">5. GECOS</text>
    <text x="502" y="182" text-anchor="middle">nom complet</text>

    <line x1="470" y1="105" x2="610" y2="140" stroke="#0f766e" stroke-width="2"/>
    <rect x="560" y="140" width="100" height="62" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="610" y="162" text-anchor="middle" font-weight="bold">6. Dossier</text>
    <text x="610" y="182" text-anchor="middle">personnel</text>

    <line x1="640" y1="105" x2="718" y2="140" stroke="#334155" stroke-width="2"/>
    <rect x="668" y="140" width="100" height="62" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="718" y="162" text-anchor="middle" font-weight="bold">7. Shell</text>
    <text x="718" y="182" text-anchor="middle">de connexion</text>
  </g>
  <rect x="20" y="230" width="760" height="80" rx="6" fill="#fffbeb" stroke="#92400e" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#111111">
    <text x="36" y="256">Le « x » signifie : l'empreinte du mot de passe n'est pas ici, elle est dans /etc/shadow</text>
    <text x="36" y="280">(lisible uniquement par root). Le noyau n'utilise que l'UID et le GID, jamais le nom.</text>
    <text x="36" y="302">Exemple fictif : l'utilisateur « alice » n'existe que pour la démonstration.</text>
  </g>
</svg>
