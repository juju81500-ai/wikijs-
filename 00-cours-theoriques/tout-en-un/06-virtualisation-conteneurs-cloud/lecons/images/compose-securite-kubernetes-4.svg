<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-labelledby="t d">
<title id="t">Objets Kubernetes : Deployment, ReplicaSet, Pods et Service</title>
<desc id="d">Un Deployment gère un ReplicaSet qui maintient trois Pods identiques. Un Service sélectionne ces Pods par étiquette et offre une adresse stable. Un Ingress route le trafic extérieur vers le Service.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
<rect width="800" height="430" fill="#ffffff"/>
<rect x="20" y="20" width="760" height="45" rx="6" fill="#e8dff5" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="400.0" y="47.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Client externe → Ingress (règles http, hôte app.example.com)</text>
<rect x="250" y="95" width="300" height="50" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="400.0" y="116.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Service « web » (adresse stable)</text>
<text x="400.0" y="133.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">selector : app=web</text>
<line x1="400" y1="65" x2="400" y2="95" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="185" width="740" height="225" rx="6" fill="#f6f8fa" stroke="#8a97a6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="45" y="208" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="start">Deployment « web » (replicas: 3, stratégie RollingUpdate)</text>
<rect x="45" y="225" width="710" height="170" rx="6" fill="#e9ecef" stroke="#4a5a6a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="247" font-family="sans-serif" font-size="13" font-weight="bold" fill="#102030" text-anchor="start">ReplicaSet (maintient 3 Pods)</text>
<rect x="75" y="265" width="190" height="115" rx="6" fill="#dff3e3" stroke="#2d6a3e" stroke-width="1.5"/>
<text x="170" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Pod web-1</text>
<rect x="95" y="300" width="150" height="55" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="170.0" y="324.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">conteneur nginx</text>
<text x="170.0" y="339.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">labels : app=web</text>
<rect x="300" y="265" width="190" height="115" rx="6" fill="#dff3e3" stroke="#2d6a3e" stroke-width="1.5"/>
<text x="395" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Pod web-2</text>
<rect x="320" y="300" width="150" height="55" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="395.0" y="324.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">conteneur nginx</text>
<text x="395.0" y="339.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">labels : app=web</text>
<rect x="525" y="265" width="190" height="115" rx="6" fill="#dff3e3" stroke="#2d6a3e" stroke-width="1.5"/>
<text x="620" y="288" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Pod web-3</text>
<rect x="545" y="300" width="150" height="55" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="620.0" y="324.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">conteneur nginx</text>
<text x="620.0" y="339.2" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">labels : app=web</text>
<line x1="330" y1="145" x2="170" y2="265" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="400" y1="145" x2="395" y2="265" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<line x1="470" y1="145" x2="620" y2="265" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
</svg>
