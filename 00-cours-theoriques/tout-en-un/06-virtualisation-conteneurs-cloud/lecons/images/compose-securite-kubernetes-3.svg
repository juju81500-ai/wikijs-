<text x="105.0" y="63.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">kubectl</text>
<rect x="230" y="20" width="550" height="180" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="245" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="start">Plan de contrôle (control plane)</text>
