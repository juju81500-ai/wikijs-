<text x="330.0" y="81.55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#102030" text-anchor="middle">kube-apiserver</text>
<text x="330.0" y="97.55" font-family="sans-serif" font-size="13" font-weight="bold" fill="#102030" text-anchor="middle">(point d'entrée)</text>
<rect x="430" y="55" width="160" height="60" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="510.0" y="81.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">etcd</text>
<text x="510.0" y="97.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">(état du cluster)</text>
<rect x="610" y="55" width="150" height="60" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
