<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
<title id="t">Architecture d'un cluster Kubernetes</title>
<desc id="d">Le plan de contrôle contient le serveur d'API, etcd, le planificateur et les contrôleurs. Chaque nœud de travail exécute kubelet, un proxy réseau et un moteur de conteneurs qui fait tourner les Pods. L'administrateur utilise kubectl.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
