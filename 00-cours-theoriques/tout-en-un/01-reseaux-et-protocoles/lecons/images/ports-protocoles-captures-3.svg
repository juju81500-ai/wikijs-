<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="sans-serif">
  <title>Anatomie d'une ligne de capture réseau</title>
  <desc>Une ligne de capture tcpdump (premier paquet SYN d'une connexion HTTP) suivie de la liste de ses éléments : heure, protocole IP, adresse et port source, adresse et port destination, drapeaux TCP, numéros de séquence, fenêtre et longueur.</desc>
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="32" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Lire une ligne de capture tcpdump</text>
  <rect x="20" y="52" width="760" height="62" rx="6" fill="#1e1e1e"/>
  <text x="34" y="78" font-size="14" fill="#ffffff" font-family="monospace">10:42:07.118 IP 198.51.100.20.50422 &gt; 203.0.113.10.80:</text>
  <text x="34" y="100" font-size="14" fill="#ffffff" font-family="monospace">Flags [S], seq 1000, win 64240, length 0</text>
  <rect x="20" y="130" width="760" height="34" rx="6" fill="#dae8fc" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="32" y="152" font-size="14" fill="#000000"><tspan font-weight="bold">①</tspan> 10:42:07.118 : heure locale de réception du paquet</text>
  <rect x="20" y="170" width="760" height="34" rx="6" fill="#fff2cc" stroke="#7f6000" stroke-width="1.5"/>
  <text x="32" y="192" font-size="14" fill="#000000"><tspan font-weight="bold">②</tspan> IP : paquet IPv4 (IP6 pour IPv6)</text>
  <rect x="20" y="210" width="760" height="34" rx="6" fill="#fce5cd" stroke="#b45f06" stroke-width="1.5"/>
  <text x="32" y="232" font-size="14" fill="#000000"><tspan font-weight="bold">③</tspan> 198.51.100.20.50422 : source, adresse puis port éphémère</text>
  <rect x="20" y="250" width="760" height="34" rx="6" fill="#f4cccc" stroke="#990000" stroke-width="1.5"/>
  <text x="32" y="272" font-size="14" fill="#000000"><tspan font-weight="bold">④</tspan> 203.0.113.10.80 : destination, adresse puis port 80 (HTTP)</text>
  <rect x="20" y="290" width="760" height="34" rx="6" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
  <text x="32" y="312" font-size="14" fill="#000000"><tspan font-weight="bold">⑤</tspan> Flags [S] : SYN ; [S.] SYN-ACK ; [.] ACK ; [P.] données ; [F.] FIN ; [R] RST</text>
  <rect x="20" y="330" width="760" height="34" rx="6" fill="#d9d2e9" stroke="#351c75" stroke-width="1.5"/>
  <text x="32" y="352" font-size="14" fill="#000000"><tspan font-weight="bold">⑥</tspan> seq, win, length : numéro de séquence, fenêtre annoncée, taille des données</text>
  <text x="400" y="388" font-size="11" fill="#000000" text-anchor="middle">Exemple fictif construit avec des adresses de documentation (RFC 5737).</text>
</svg>
