<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="t d">
  <title id="t">Correspondance entre le modèle OSI à 7 couches et le modèle TCP/IP à 4 couches</title>
  <desc id="d">Tableau en trois colonnes : les sept couches OSI de l'application à la physique, les quatre couches TCP/IP qui les regroupent, et pour chaque niveau le nom de l'unité de données (PDU) avec des protocoles d'exemple.</desc>
  <rect width="800" height="470" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
    <text x="400" y="26" font-size="20" font-weight="bold" text-anchor="middle">OSI (7 couches) et TCP/IP (4 couches)</text>
    <text x="140" y="56" font-weight="bold" text-anchor="middle">Modèle OSI</text>
    <text x="375" y="56" font-weight="bold" text-anchor="middle">Modèle TCP/IP</text>
    <text x="635" y="56" font-weight="bold" text-anchor="middle">PDU et exemples</text>

    <!-- OSI -->
    <rect x="20" y="66" width="240" height="48" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="32" y="95">7 · Application</text>
    <rect x="20" y="118" width="240" height="48" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="32" y="147">6 · Présentation</text>
    <rect x="20" y="170" width="240" height="48" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="32" y="199">5 · Session</text>
    <rect x="20" y="222" width="240" height="48" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
    <text x="32" y="251">4 · Transport</text>
    <rect x="20" y="274" width="240" height="48" fill="#fef9c3" stroke="#713f12" stroke-width="2"/>
    <text x="32" y="303">3 · Réseau</text>
    <rect x="20" y="326" width="240" height="48" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
    <text x="32" y="355">2 · Liaison de données</text>
    <rect x="20" y="378" width="240" height="48" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
    <text x="32" y="407">1 · Physique</text>

    <!-- TCP/IP -->
    <rect x="270" y="66" width="210" height="152" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="2"/>
    <text x="375" y="140" text-anchor="middle" font-weight="bold">Application</text>
    <rect x="270" y="222" width="210" height="48" fill="#bbf7d0" stroke="#14532d" stroke-width="2"/>
    <text x="375" y="251" text-anchor="middle" font-weight="bold">Transport</text>
    <rect x="270" y="274" width="210" height="48" fill="#fde68a" stroke="#713f12" stroke-width="2"/>
    <text x="375" y="303" text-anchor="middle" font-weight="bold">Internet</text>
    <rect x="270" y="326" width="210" height="100" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/>
    <text x="375" y="372" text-anchor="middle" font-weight="bold">Accès réseau</text>
    <text x="375" y="392" text-anchor="middle" font-size="12">(Ethernet, Wi-Fi…)</text>

    <!-- PDU -->
    <rect x="490" y="66" width="290" height="152" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="502" y="108" font-weight="bold">Données / message</text>
    <text x="502" y="136">HTTP, DNS, SMTP, SSH, DHCP</text>
    <text x="502" y="160">TLS (chiffrement, format)</text>
    <text x="502" y="184">Ouverture et suivi d'échanges</text>
    <rect x="490" y="222" width="290" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="502" y="243" font-weight="bold" font-size="13">Segment (TCP) · Datagramme (UDP)</text>
    <text x="502" y="262" font-size="12">Ports source et destination</text>
    <rect x="490" y="274" width="290" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="502" y="295" font-weight="bold">Paquet</text>
    <text x="502" y="314" font-size="12">IPv4, IPv6, ICMP · adresses IP</text>
    <rect x="490" y="326" width="290" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="502" y="347" font-weight="bold">Trame</text>
    <text x="502" y="366" font-size="12">Ethernet, 802.11 · adresses MAC</text>
    <rect x="490" y="378" width="290" height="48" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="502" y="399" font-weight="bold">Bits</text>
    <text x="502" y="418" font-size="12">Signaux : cuivre, fibre, radio</text>

    <text x="400" y="454" font-size="12" text-anchor="middle">Création originale du projet Pack Master (CC0). Les couches 5 à 7 d'OSI sont regroupées en « Application » dans TCP/IP.</text>
  </g>
</svg>
