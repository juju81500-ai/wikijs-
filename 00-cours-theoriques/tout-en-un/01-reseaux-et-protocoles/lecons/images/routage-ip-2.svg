<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Décision d'envoi d'un paquet IP par un hôte puis par un routeur</title>
<desc id="d">L'hôte compare l'adresse de destination à son propre sous-réseau. Si elle est locale, il fait un ARP et envoie directement. Sinon il envoie à la passerelle. Le routeur cherche dans sa table la route la plus spécifique, sinon la route par défaut, sinon il abandonne le paquet.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b00020"/></marker></defs>
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="30" font-family="sans-serif" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="bold">Que devient un paquet IP ? La décision en 3 questions</text>
<rect x="260" y="50" width="280" height="50" rx="8" fill="#cfe3ff" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="81" font-family="sans-serif" font-size="18" fill="#1b2a41" text-anchor="middle" font-weight="bold">Paquet à destination de D</text>
<line x1="400" y1="100" x2="400" y2="130" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<rect x="230" y="130" width="340" height="60" rx="8" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="155" font-family="sans-serif" font-size="17" fill="#1b2a41" text-anchor="middle" font-weight="bold">1. D est dans mon sous-réseau ?</text>
<text x="400" y="178" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">(adresse &amp; masque)</text>
<line x1="230" y1="160" x2="130" y2="160" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="180" y="150" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="bold">oui</text>
<rect x="10" y="130" width="120" height="60" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="70" y="155" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">ARP puis envoi</text>
<text x="70" y="173" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">direct à D</text>
<line x1="400" y1="190" x2="400" y2="230" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="420" y="215" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="start" font-weight="bold">non</text>
<rect x="230" y="230" width="340" height="60" rx="8" fill="#e8ecf1" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="255" font-family="sans-serif" font-size="17" fill="#1b2a41" text-anchor="middle" font-weight="bold">Envoi à la passerelle (routeur)</text>
<text x="400" y="278" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">ARP de l'adresse de la passerelle</text>
<line x1="400" y1="290" x2="400" y2="320" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<rect x="210" y="320" width="380" height="60" rx="8" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="345" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle" font-weight="bold">2. Le routeur cherche dans sa table</text>
<text x="400" y="368" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">le préfixe le plus long qui correspond</text>
<line x1="590" y1="350" x2="640" y2="350" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="615" y="340" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">trouvé</text>
<rect x="640" y="320" width="150" height="60" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="715" y="343" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">Envoi au saut</text>
<text x="715" y="361" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">suivant (next hop)</text>
<line x1="400" y1="380" x2="400" y2="420" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="420" y="405" font-family="sans-serif" font-size="15" fill="#1b2a41" text-anchor="start" font-weight="bold">aucun</text>
<rect x="230" y="420" width="340" height="60" rx="8" fill="#fff3b0" stroke="#1b2a41" stroke-width="2"/>
<text x="400" y="445" font-family="sans-serif" font-size="17" fill="#1b2a41" text-anchor="middle" font-weight="bold">3. Route par défaut (0.0.0.0/0) ?</text>
<text x="400" y="468" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">sinon : paquet abandonné + ICMP</text>
<line x1="570" y1="450" x2="640" y2="450" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="605" y="440" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">oui</text>
<rect x="640" y="420" width="150" height="60" rx="8" fill="#d4f1d4" stroke="#1b2a41" stroke-width="2"/>
<text x="715" y="443" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">Envoi vers la</text>
<text x="715" y="461" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">passerelle suivante</text>
<line x1="230" y1="450" x2="130" y2="450" stroke="#1b2a41" stroke-width="3" marker-end="url(#arr)"/>
<text x="180" y="440" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="bold">non</text>
<rect x="10" y="420" width="120" height="60" rx="8" fill="#ffd0d0" stroke="#b00020" stroke-width="2"/>
<text x="70" y="443" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">Abandon</text>
<text x="70" y="461" font-family="sans-serif" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="normal">(unreachable)</text>
</svg>
