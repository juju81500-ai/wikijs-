<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="sans-serif">
  <title>Ce que le réseau voit lors d'une visite HTTPS</title>
  <desc>Quatre étapes empilées : 1. requête DNS en UDP vers le port 53 ; 2. poignée de main TCP vers le port 443 ; 3. négociation TLS, où le nom du site est visible dans le premier message mais pas le contenu ensuite ; 4. échanges HTTP chiffrés, invisibles pour un observateur du réseau.</desc>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="34" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Visite de https://www.example.com : ce que voit un observateur du réseau</text>
  <rect x="40" y="55" width="520" height="70" rx="8" fill="#dae8fc" stroke="#1f4e79" stroke-width="2"/>
  <text x="56" y="80" font-size="15" fill="#000000" font-weight="bold">1. DNS : UDP/53 (ou TCP/53)</text>
  <text x="56" y="102" font-size="13" fill="#000000">Question « www.example.com ? » puis réponse A/AAAA, en clair</text>
  <rect x="40" y="140" width="520" height="70" rx="8" fill="#e2efda" stroke="#375623" stroke-width="2"/>
  <text x="56" y="165" font-size="15" fill="#000000" font-weight="bold">2. TCP : SYN, SYN-ACK, ACK vers le port 443</text>
  <text x="56" y="187" font-size="13" fill="#000000">Adresses IP et ports visibles : qui parle à qui, quand, combien</text>
  <rect x="40" y="225" width="520" height="70" rx="8" fill="#fff2cc" stroke="#7f6000" stroke-width="2"/>
  <text x="56" y="250" font-size="15" fill="#000000" font-weight="bold">3. TLS : ClientHello puis ServerHello, certificat, clés</text>
  <text x="56" y="272" font-size="13" fill="#000000">Le nom du site (SNI) est visible dans le ClientHello, sauf ECH</text>
  <rect x="40" y="310" width="520" height="70" rx="8" fill="#f4cccc" stroke="#990000" stroke-width="2"/>
  <text x="56" y="335" font-size="15" fill="#000000" font-weight="bold">4. HTTP chiffré dans TLS : « Application Data »</text>
  <text x="56" y="357" font-size="13" fill="#000000">URL, en-têtes, cookies et contenu : illisibles sans la clé de session</text>
  <rect x="580" y="55" width="190" height="70" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="675" y="86" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Lisible en clair</text>
  <text x="675" y="106" font-size="12" fill="#000000" text-anchor="middle">nom demandé, réponse</text>
  <rect x="580" y="140" width="190" height="70" rx="8" fill="#ffffff" stroke="#375623" stroke-width="2"/>
  <text x="675" y="171" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Lisible en clair</text>
  <text x="675" y="191" font-size="12" fill="#000000" text-anchor="middle">IP, ports, volumes</text>
  <rect x="580" y="225" width="190" height="70" rx="8" fill="#ffffff" stroke="#7f6000" stroke-width="2"/>
  <text x="675" y="256" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Partiellement lisible</text>
  <text x="675" y="276" font-size="12" fill="#000000" text-anchor="middle">versions, nom (SNI)</text>
  <rect x="580" y="310" width="190" height="70" rx="8" fill="#ffffff" stroke="#990000" stroke-width="2"/>
  <text x="675" y="341" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">Opaque</text>
  <text x="675" y="361" font-size="12" fill="#000000" text-anchor="middle">sans la clé de session</text>
  <text x="400" y="412" font-size="12" fill="#000000" text-anchor="middle">Ports habituels : DNS 53, HTTP 80, HTTPS 443. HTTP/3 utilise QUIC sur UDP/443.</text>
</svg>
