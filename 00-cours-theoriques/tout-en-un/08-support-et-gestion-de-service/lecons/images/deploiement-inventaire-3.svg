<text x="410.0" y="214.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">(source de vérité)</text>
<text x="410" y="385" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Rapprocher les sources et signaler les écarts : un poste connu d&#x27;une source seule est suspect</text>
