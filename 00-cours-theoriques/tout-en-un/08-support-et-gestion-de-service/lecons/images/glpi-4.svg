<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Cycle de la base de connaissances</title>
<desc id="d">Quatre étapes en boucle : ticket résolu, rédaction d&#x27;un article, relecture et publication, réutilisation de l&#x27;article pour le cas suivant.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">La base de connaissances : un cercle vertueux</tspan></text>
<rect x="300" y="70" width="200" height="70" rx="8" fill="#fde2e2" stroke="#9b1c1c" stroke-width="2"/>
<text x="400" y="110" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">1. Ticket résolu</tspan></text>
<rect x="570" y="170" width="200" height="70" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="670" y="210" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="670" dy="0">2. Rédiger l&#x27;article</tspan></text>
<rect x="300" y="290" width="200" height="70" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="400" y="330" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">3. Relire et publier</tspan></text>
<rect x="30" y="170" width="200" height="70" rx="8" fill="#e1f5e6" stroke="#1e6b34" stroke-width="2"/>
<text x="130" y="210" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="130" dy="0">4. Réutiliser l&#x27;article</tspan></text>
<line x1="500" y1="100" x2="610" y2="170" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="610" y1="240" x2="500" y2="310" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="300" y1="320" x2="150" y2="240" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="130" y1="168" x2="300" y2="105" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="385" font-size="14" text-anchor="middle" font-weight="normal" fill="#34495e"><tspan x="400" dy="0">Moins de tickets répétitifs, résolutions plus rapides, connaissance qui survit aux départs.</tspan></text>

</svg>
