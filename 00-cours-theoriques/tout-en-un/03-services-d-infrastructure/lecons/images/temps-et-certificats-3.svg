<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Principe du protocole ACME</title>
<desc>Un client ACME sur le serveur demande un certificat à une autorité de certification. L'autorité lance un défi pour vérifier que le demandeur contrôle le domaine, par exemple un fichier servi en HTTP ou un enregistrement DNS TXT. Après validation, l'autorité signe et renvoie le certificat, que le client installe puis renouvelle automatiquement.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">ACME : prouver le contrôle du domaine, puis recevoir le certificat</text>
<rect x="20" y="90" width="220" height="150" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="130.0" y="140.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Client ACME</text>
<text x="130.0" y="160.25" text-anchor="middle" font-size="15" fill="#111111">sur le serveur</text>
<text x="130.0" y="180.25" text-anchor="middle" font-size="15" fill="#111111">example.com</text>
<text x="130.0" y="200.25" text-anchor="middle" font-size="15" fill="#111111">(certbot, acme.sh…)</text>
<rect x="560" y="90" width="220" height="150" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="670.0" y="150.25" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Autorité ACME</text>
<text x="670.0" y="170.25" text-anchor="middle" font-size="15" fill="#111111">(Let's Encrypt ou</text>
<text x="670.0" y="190.25" text-anchor="middle" font-size="15" fill="#111111">CA interne ACME)</text>
<line x1="242" y1="110" x2="558" y2="110" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="100" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">1. compte + demande de certificat</text>
<line x1="558" y1="150" x2="242" y2="150" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="142" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">2. défi (jeton à publier)</text>
<line x1="242" y1="190" x2="558" y2="190" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="182" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">3. preuve : fichier HTTP ou TXT DNS</text>
<line x1="558" y1="230" x2="242" y2="230" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<text x="400" y="222" text-anchor="middle" font-size="14" fill="#111111" stroke="#ffffff" stroke-width="4" paint-order="stroke">4. certificat signé</text>
<rect x="20" y="275" width="760" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="400.0" y="300.4" text-anchor="middle" font-size="14" fill="#111111">Défis courants : HTTP-01 (port 80, /.well-known/acme-challenge/)</text>
<text x="400.0" y="319.4" text-anchor="middle" font-size="14" fill="#111111">DNS-01 (enregistrement TXT ; seul défi permettant un certificat joker)</text>
<rect x="20" y="350" width="760" height="55" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="400.0" y="372.9" text-anchor="middle" font-size="14" fill="#111111">Les certificats sont de courte durée : un minuteur (timer) renouvelle automatiquement</text>
<text x="400.0" y="391.9" text-anchor="middle" font-size="14" fill="#111111">puis recharge le service sans coupure</text>
</svg>
