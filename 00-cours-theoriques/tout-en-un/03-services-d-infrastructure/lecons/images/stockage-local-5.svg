<line x1="580" y1="135" x2="630" y2="135" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="580" y1="230" x2="630" y2="230" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="630" y="290" width="150" height="50" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="705.0" y="310.7" text-anchor="middle" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">lvextend -r</text>
<text x="705.0" y="327.7" text-anchor="middle" font-size="12" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">(extension à chaud)</text>
<line x1="565" y1="285" x2="630" y2="315" stroke="#1a1a1a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="400" y="400" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Le groupe de volumes agit comme un réservoir : on y découpe des volumes logiques</text>
<text x="400" y="424" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">et on peut les agrandir sans arrêt tant qu'il reste des extents libres.</text>
<text x="400" y="460" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Astuce : vgextend ajoute un nouveau disque au réservoir quand il est plein.</text>
</svg>
