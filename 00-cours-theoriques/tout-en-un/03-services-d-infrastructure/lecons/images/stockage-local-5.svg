<text x="100.0" y="319.4" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">100 Go</text>
<rect x="230" y="270" width="140" height="70" rx="8" fill="#d4f2d4" stroke="#1a1a1a" stroke-width="2"/>
