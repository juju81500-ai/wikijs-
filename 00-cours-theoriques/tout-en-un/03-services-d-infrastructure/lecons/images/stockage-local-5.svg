<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
<title id="t">Pile LVM : disques, volumes physiques, groupe de volumes, volumes logiques</title>
<desc id="d">Trois disques deviennent trois volumes physiques (PV), réunis dans un groupe de volumes (VG) qui contient de l'espace libre et deux volumes logiques (LV) : données et journaux, avec une flèche d'extension à chaud.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect width="800" height="520" fill="#ffffff"/>
<text x="400" y="32" text-anchor="middle" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">LVM : de disques bruts à des volumes souples</text>
<text x="100" y="70" text-anchor="middle" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Disques / partitions</text>
<text x="300" y="70" text-anchor="middle" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Volumes physiques (PV)</text>
<text x="500" y="70" text-anchor="middle" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Groupe de volumes (VG)</text>
<text x="700" y="70" text-anchor="middle" font-size="13" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Volumes logiques (LV)</text>
