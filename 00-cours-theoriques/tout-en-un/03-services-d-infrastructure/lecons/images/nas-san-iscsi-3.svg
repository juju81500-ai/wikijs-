<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">Multipath : deux chemins redondants entre serveur et baie</title>
<desc id="d">Le serveur dispose de deux cartes réseau reliées à deux commutateurs distincts, eux-mêmes reliés à deux contrôleurs de la baie. Le service multipath regroupe les chemins en un seul périphérique /dev/mapper/mpatha et bascule en cas de panne.</desc>
