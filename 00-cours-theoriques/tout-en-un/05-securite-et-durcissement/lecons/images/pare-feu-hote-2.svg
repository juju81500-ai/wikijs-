<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
<title id="t">Chronologie anti-lockout : minuterie de retour arrière</title>
<desc id="d">Chronologie : une session A reste ouverte, une minuterie planifie le retour arrière, la règle est appliquée, une session B de test valide l'accès, puis la minuterie est annulée ; sinon elle restaure automatiquement.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="340" fill="#ffffff"/>
<text x="400" y="34" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Anti-lockout : une minuterie qui protège votre accès</text>
<line x1="40" y1="110" x2="760" y2="110" stroke="#1b2a41" stroke-width="4"/>
<circle cx="60" cy="110" r="14" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="60" y="116" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">0</text>
<text x="60" y="150.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Session A</text>
<text x="60" y="169.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">ouverte</text>
<circle cx="220" cy="110" r="14" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="220" y="116" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">1</text>
<text x="220" y="150.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Minuterie de</text>
<text x="220" y="169.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">retour (5 min)</text>
<circle cx="380" cy="110" r="14" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="380" y="116" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">2</text>
<text x="380" y="150.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Application</text>
<text x="380" y="169.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">des règles</text>
<circle cx="540" cy="110" r="14" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="540" y="116" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">3</text>
<text x="540" y="150.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Session B</text>
<text x="540" y="169.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">de test</text>
<circle cx="700" cy="110" r="14" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="700" y="116" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">4</text>
<text x="700" y="150.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Décision</text>
<text x="700" y="169.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif"></text>
<rect x="40" y="215" width="330" height="90" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="205.0" y="255.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Test réussi → annuler la minuterie</text>
<text x="205.0" y="275.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">et enregistrer la configuration</text>
<rect x="430" y="215" width="330" height="90" rx="10" fill="#fde4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="595.0" y="255.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Test échoué ou session perdue →</text>
<text x="595.0" y="275.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">la minuterie restaure l'ancien état seule</text>
<line x1="700" y1="170" x2="200" y2="215" stroke="#2a6f2a" stroke-width="2" marker-end="url(#a)"/>
<line x1="700" y1="170" x2="600" y2="215" stroke="#b3261e" stroke-width="2" marker-end="url(#a)"/>
</svg>
