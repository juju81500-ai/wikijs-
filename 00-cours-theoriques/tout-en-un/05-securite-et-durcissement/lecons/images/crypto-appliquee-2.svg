<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
<title id="t">Hachage salé et dérivation de clé</title>
<desc id="d">Un mot de passe et un sel aléatoire entrent dans une fonction de dérivation lente comme Argon2id ; seule l'empreinte et le sel sont stockés. À la connexion, on recalcule et on compare.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b1b1b"/></marker></defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Stocker un mot de passe : sel + fonction lente</text>
<rect x="20" y="50" width="860" height="170" rx="12" fill="#eef3fb" stroke="#1a3d7c" stroke-width="2" stroke-dasharray="10 6"/>
<text x="32" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1a3d7c">Création du compte</text>
<rect x="40" y="95" width="150" height="70" rx="8" fill="#ffffff" stroke="#1a3d7c" stroke-width="2"/>
<text x="115.0" y="125.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Mot de passe</text>
<text x="115.0" y="144.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">saisi (exemple)</text>
<rect x="40" y="175" width="150" height="35" rx="8" fill="#ffe08a" stroke="#8a5a00" stroke-width="2"/>
<text x="115.0" y="197.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Sel aléatoire unique</text>
<rect x="300" y="110" width="200" height="80" rx="8" fill="#ffffff" stroke="#1a3d7c" stroke-width="2"/>
<text x="400.0" y="135.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Argon2id / scrypt /</text>
<text x="400.0" y="154.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">bcrypt / PBKDF2</text>
<text x="400.0" y="173.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">(coût réglé)</text>
<rect x="620" y="95" width="240" height="100" rx="8" fill="#e6f6ea" stroke="#1c6b34" stroke-width="2"/>
<text x="740.0" y="130.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Base de données</text>
<text x="740.0" y="149.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">paramètres + sel</text>
<text x="740.0" y="168.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">+ empreinte</text>
<line x1="190" y1="130" x2="300" y2="145" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="190" y1="192" x2="300" y2="170" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="500" y1="150" x2="620" y2="145" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="560" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">empreinte</text>
<rect x="20" y="235" width="860" height="170" rx="12" fill="#fff0f0" stroke="#8b0000" stroke-width="2" stroke-dasharray="10 6"/>
<text x="32" y="257" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#8b0000">Connexion : on recalcule et on compare</text>
<rect x="40" y="280" width="150" height="60" rx="8" fill="#ffffff" stroke="#8b0000" stroke-width="2"/>
<text x="115.0" y="305.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Mot de passe</text>
<text x="115.0" y="324.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">saisi</text>
<rect x="300" y="275" width="200" height="70" rx="8" fill="#ffffff" stroke="#8b0000" stroke-width="2"/>
<text x="400.0" y="305.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Même fonction,</text>
<text x="400.0" y="324.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">même sel, mêmes coûts</text>
<rect x="620" y="275" width="240" height="70" rx="8" fill="#ffffff" stroke="#8b0000" stroke-width="2"/>
<text x="740.0" y="305.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">Empreinte égale ?</text>
<text x="740.0" y="324.4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">oui → accès, non → refus</text>
<line x1="190" y1="310" x2="300" y2="310" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="500" y1="310" x2="620" y2="310" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Jamais de mot de passe en clair, jamais de SHA-256 nu : une empreinte rapide se force trop vite.</text>
</svg>
