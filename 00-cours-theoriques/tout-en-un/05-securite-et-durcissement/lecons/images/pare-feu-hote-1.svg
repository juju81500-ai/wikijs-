<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
<title id="t">Parcours d'un paquet entrant avec une politique par défaut refus</title>
<desc id="d">Un paquet entrant est accepté s'il appartient à une connexion établie ou s'il correspond à une règle minimale ; sinon il est journalisé puis refusé par la politique par défaut.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="34" font-size="20" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Politique par défaut : refuser, puis autoriser le strict nécessaire</text>
<rect x="20" y="80" width="110" height="80" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="75.0" y="115.19999999999999" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Paquet</text>
<text x="75.0" y="136.0" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">entrant</text>
<rect x="170" y="70" width="190" height="100" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="265.0" y="105.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Connexion déjà</text>
<text x="265.0" y="125.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">établie ?</text>
<text x="265.0" y="144.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">(état conntrack)</text>
<rect x="410" y="70" width="190" height="100" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="505.0" y="105.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Règle minimale ?</text>
<text x="505.0" y="125.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">ex. SSH depuis</text>
<text x="505.0" y="144.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">192.0.2.0/24</text>
<rect x="650" y="70" width="130" height="100" rx="10" fill="#ece6f7" stroke="#1b2a41" stroke-width="2"/>
<text x="715.0" y="115.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Journaliser</text>
<text x="715.0" y="135.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">(avec limite)</text>
<line x1="130" y1="120" x2="170" y2="120" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="360" y1="120" x2="410" y2="120" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="600" y1="120" x2="650" y2="120" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="385" y="110" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">non</text>
<text x="625" y="110" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">non</text>
<rect x="190" y="230" width="150" height="55" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="265.0" y="263.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">ACCEPTER</text>
<line x1="265" y1="170" x2="265" y2="230" stroke="#2a6f2a" stroke-width="3" marker-end="url(#a)"/>
<text x="285" y="205" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">oui</text>
<rect x="430" y="230" width="150" height="55" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="505.0" y="263.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">ACCEPTER</text>
<line x1="505" y1="170" x2="505" y2="230" stroke="#2a6f2a" stroke-width="3" marker-end="url(#a)"/>
<text x="525" y="205" font-size="14" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">oui</text>
<rect x="640" y="230" width="150" height="55" rx="10" fill="#fde4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="715.0" y="253.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">REFUSER</text>
<text x="715.0" y="272.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">(policy drop)</text>
<line x1="715" y1="170" x2="715" y2="230" stroke="#b3261e" stroke-width="3" marker-end="url(#a)"/>
<rect x="20" y="325" width="760" height="70" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="355.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Accès de secours : règle SSH depuis le réseau d'administration + console de l'hyperviseur,</text>
<text x="400.0" y="375.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">testée AVANT d'activer la politique refus</text>
</svg>
