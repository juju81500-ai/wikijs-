<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">Zones réseau et flux autorisés</title>
<desc id="d">Internet, DMZ, réseau interne et zone d'administration séparés par un pare-feu. Les flux autorisés sont indiqués par des flèches ; le trafic de la DMZ vers l'interne est limité.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b1b1b"/></marker></defs>
