<text x="440" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">SSH/RDP via bastion</text>
<text x="250" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#111111">Aucun flux direct Internet → interne. DMZ → interne limité (hôte, port) et journalisé.</text>
