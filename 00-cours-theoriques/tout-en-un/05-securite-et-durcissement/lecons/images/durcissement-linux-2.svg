<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
<title id="t">Cycle de modification sûre : snapshot, console, test, retour arrière</title>
<desc id="d">Cinq étapes en séquence : snapshot, console de secours, changement avec contrôle de syntaxe, test depuis une seconde session, puis validation ou retour arrière.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="330" fill="#ffffff"/>
<text x="400" y="34" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Toute modification de sécurité suit le même cycle</text>
<rect x="20" y="70" width="130" height="130" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="85.0" y="120.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Snapshot ou</text>
<text x="85.0" y="140.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">copie de la</text>
<text x="85.0" y="159.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">configuration</text>
<circle cx="38" cy="70" r="16" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="38" y="76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">1</text>
<line x1="150" y1="135" x2="174" y2="135" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="174" y="70" width="130" height="130" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="239.0" y="120.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Console de</text>
<text x="239.0" y="140.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">secours ouverte</text>
<text x="239.0" y="159.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">(hyperviseur)</text>
<circle cx="192" cy="70" r="16" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="192" y="76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">2</text>
<line x1="304" y1="135" x2="328" y2="135" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="328" y="70" width="130" height="130" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="393.0" y="120.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Changement +</text>
<text x="393.0" y="140.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">contrôle de</text>
<text x="393.0" y="159.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">syntaxe</text>
<circle cx="346" cy="70" r="16" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="346" y="76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">3</text>
<line x1="458" y1="135" x2="482" y2="135" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="482" y="70" width="130" height="130" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="547.0" y="120.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Test depuis</text>
<text x="547.0" y="140.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">une 2ᵉ session</text>
<text x="547.0" y="159.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">indépendante</text>
<circle cx="500" cy="70" r="16" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="500" y="76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">4</text>
<line x1="612" y1="135" x2="636" y2="135" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="636" y="70" width="130" height="130" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="701.0" y="120.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Valider</text>
<text x="701.0" y="140.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">ou retour</text>
<text x="701.0" y="159.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">arrière</text>
<circle cx="654" cy="70" r="16" fill="#1b2a41" stroke="#1b2a41" stroke-width="2"/>
<text x="654" y="76" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-family="sans-serif">5</text>
<line x1="690" y1="200" x2="690" y2="262" stroke="#1b2a41" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="690" y1="262" x2="100" y2="262" stroke="#1b2a41" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="100" y1="262" x2="100" y2="202" stroke="#1b2a41" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
<text x="395" y="252" font-size="15" fill="#8a1c12" text-anchor="middle" font-weight="normal" font-family="sans-serif">si le test échoue : restaurer la copie, recharger, retester</text>
<text x="400" y="305" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Ne fermez jamais la session ouverte avant que la nouvelle session ait réussi.</text>
</svg>
