<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">Principe de LAPS : mot de passe administrateur local unique par poste</title>
<desc id="d">Le poste génère un mot de passe aléatoire pour le compte administrateur local et le dépose dans l'annuaire avec une échéance ; un administrateur autorisé peut le consulter et la rotation le renouvelle.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<text x="400" y="34" font-size="22" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">LAPS : un mot de passe local différent sur chaque poste</text>
<rect x="20" y="90" width="210" height="100" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="125.0" y="125.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Poste PC-01</text>
<text x="125.0" y="145.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">compte admin local</text>
<text x="125.0" y="164.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">mot de passe aléatoire</text>
<rect x="295" y="90" width="210" height="100" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="125.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Annuaire</text>
<text x="400.0" y="145.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">(AD ou Entra ID)</text>
<text x="400.0" y="164.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">mot de passe + échéance</text>
<rect x="570" y="90" width="210" height="100" rx="10" fill="#e3f4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="675.0" y="125.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Administrateur</text>
<text x="675.0" y="145.25" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">autorisé (droit</text>
<text x="675.0" y="164.75" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">délégué + audit)</text>
<line x1="230" y1="125" x2="295" y2="125" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="262" y="112" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">dépose</text>
<line x1="570" y1="155" x2="505" y2="155" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="538" y="178" font-size="13" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">consulte</text>
<rect x="20" y="240" width="760" height="80" rx="10" fill="#fde4e1" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="275.5" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Rotation à échéance ou après usage : un mot de passe volé sur PC-01 est inutile sur PC-02</text>
<text x="400.0" y="295.0" font-size="15" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">(plus de mot de passe administrateur identique cloné sur tout le parc)</text>
<text x="400" y="355" font-size="15" fill="#8a1c12" text-anchor="middle" font-weight="normal" font-family="sans-serif">Attention : lire le mot de passe est un acte sensible, il doit être tracé.</text>
</svg>
