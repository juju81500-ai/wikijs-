<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img">
<title>Le shell entre l'utilisateur et le noyau</title>
<desc>Trois couches : l'utilisateur tape une commande, le shell Bash l'interprète et lance des programmes, le noyau accède au matériel.</desc>
<defs><marker id="a1b2a41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text xml:space="preserve" x="400" y="36" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111111" text-anchor="middle">Où se place le shell ?</text>
<rect x="40" y="70" width="720" height="70" rx="8" fill="#fff4cc" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="400.0" y="112.0" font-family="sans-serif" font-size="20" font-weight="normal" fill="#111111" text-anchor="middle">Vous : clavier, terminal, script (.sh)</text>
<rect x="40" y="170" width="720" height="70" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="400.0" y="212.0" font-family="sans-serif" font-size="20" font-weight="normal" fill="#111111" text-anchor="middle">Shell (Bash) : lit, développe, lance les programmes</text>
<rect x="40" y="270" width="720" height="70" rx="8" fill="#e3f5e8" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="400.0" y="312.0" font-family="sans-serif" font-size="20" font-weight="normal" fill="#111111" text-anchor="middle">Noyau Linux : processus, fichiers, réseau, mémoire</text>
<line x1="400" y1="140" x2="400" y2="170" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<line x1="400" y1="240" x2="400" y2="270" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<text xml:space="preserve" x="400" y="375" font-family="sans-serif" font-size="16" font-weight="normal" fill="#111111" text-anchor="middle">Chaque étage ne parle qu'à ses voisins : le shell traduit vos ordres en appels au noyau.</text>
<text xml:space="preserve" x="400" y="400" font-family="sans-serif" font-size="15" font-weight="normal" fill="#333333" text-anchor="middle">(programmes externes : ls, grep, cp... sont lancés par le shell)</text>
</svg>
