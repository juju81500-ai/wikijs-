<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<title>Les cinq étapes d'un script d'administration robuste</title>
<desc>De haut en bas : entête strict, arguments, protections, travail, compte rendu.</desc>
<defs><marker id="a1b2a41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="500" fill="#ffffff"/>
<text xml:space="preserve" x="400" y="34" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111111" text-anchor="middle">Squelette d'un script robuste</text>
<rect x="40" y="66" width="720" height="62" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="60" y="104" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">1  Entête</text>
<text xml:space="preserve" x="240" y="104" font-family="sans-serif" font-size="17" font-weight="normal" fill="#111111" text-anchor="start">shebang bash, set -euo pipefail, constantes readonly</text>
<line x1="400" y1="128" x2="400" y2="150" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="40" y="150" width="720" height="62" rx="8" fill="#fff4cc" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="60" y="188" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">2  Arguments</text>
<text xml:space="preserve" x="240" y="188" font-family="sans-serif" font-size="17" font-weight="normal" fill="#111111" text-anchor="start">getopts, validation, option simulation (-n), usage</text>
<line x1="400" y1="212" x2="400" y2="234" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="40" y="234" width="720" height="62" rx="8" fill="#e3f5e8" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="60" y="272" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">3  Protections</text>
<text xml:space="preserve" x="240" y="272" font-family="sans-serif" font-size="17" font-weight="normal" fill="#111111" text-anchor="start">trap EXIT (nettoyage), verrou flock -n</text>
<line x1="400" y1="296" x2="400" y2="318" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="40" y="318" width="720" height="62" rx="8" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="60" y="356" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">4  Travail</text>
<text xml:space="preserve" x="240" y="356" font-family="sans-serif" font-size="17" font-weight="normal" fill="#111111" text-anchor="start">fonctions, contrôles explicites (|| die)</text>
<line x1="400" y1="380" x2="400" y2="402" stroke="#1b2a41" stroke-width="3" marker-end="url(#a1b2a41)"/>
<rect x="40" y="402" width="720" height="62" rx="8" fill="#fff4cc" stroke="#1b2a41" stroke-width="2"/>
<text xml:space="preserve" x="60" y="440" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">5  Compte rendu</text>
<text xml:space="preserve" x="240" y="440" font-family="sans-serif" font-size="17" font-weight="normal" fill="#111111" text-anchor="start">journal horodaté, code retour 0 / 1 / 2</text>
</svg>
