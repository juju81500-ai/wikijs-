<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
<title id="t">Gestion d&#x27;erreurs PowerShell avec try, catch et finally</title>
<desc id="d">Organigramme : le bloc try s&#x27;exécute ; en cas d&#x27;erreur terminante, le bloc catch prend le relais ; le bloc finally s&#x27;exécute dans tous les cas.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="420" fill="#f7f9fc"/>
<text x="400" y="36" font-family="sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="bold">try / catch / finally</text>
<rect x="300" y="60" width="200" height="70" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="79.0" font-family="monospace" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">try</text>
<text x="400.0" y="100.6" font-family="monospace" font-size="16" fill="#111111" text-anchor="middle">action risquée</text>
<text x="400.0" y="122.2" font-family="monospace" font-size="16" fill="#111111" text-anchor="middle">-ErrorAction Stop</text>
<rect x="60" y="200" width="220" height="80" rx="8" fill="#fee2e2" stroke="#1b2a41" stroke-width="2"/>
<text x="170.0" y="225.0" font-family="monospace" font-size="15" fill="#111111" text-anchor="middle" font-weight="bold">catch</text>
<text x="170.0" y="245.25" font-family="monospace" font-size="15" fill="#111111" text-anchor="middle">journaliser l&#x27;erreur</text>
<text x="170.0" y="265.5" font-family="monospace" font-size="15" fill="#111111" text-anchor="middle">$_.Exception.Message</text>
<rect x="520" y="200" width="220" height="80" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="630.0" y="234.475" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle" font-weight="bold">suite normale</text>
<text x="630.0" y="257.425" font-family="sans-serif" font-size="17" fill="#111111" text-anchor="middle">aucune erreur</text>
<line x1="340" y1="130" x2="200" y2="200" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="235" y="158" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">erreur</text>
<line x1="460" y1="130" x2="620" y2="200" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="565" y="158" font-family="sans-serif" font-size="16" fill="#1b2a41" text-anchor="middle">succès</text>
<rect x="300" y="330" width="200" height="60" rx="8" fill="#fef9c3" stroke="#1b2a41" stroke-width="2"/>
<text x="400.0" y="354.8" font-family="monospace" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold">finally</text>
<text x="400.0" y="376.40000000000003" font-family="monospace" font-size="16" fill="#111111" text-anchor="middle">nettoyage</text>
<line x1="170" y1="280" x2="330" y2="330" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="630" y1="280" x2="470" y2="330" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="318" font-family="sans-serif" font-size="10" fill="#111111" text-anchor="middle"></text>
</svg>
