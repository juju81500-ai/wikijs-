<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Cycle de travail sûr en administration : lire, simuler, appliquer, vérifier</title>
<desc id="d">Cycle en quatre étapes : Get pour lire l&#x27;état, WhatIf pour simuler, application réelle avec Confirm si besoin, puis vérification et journalisation.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="400" fill="#f7f9fc"/>
<text x="400" y="36" font-family="sans-serif" font-size="26" fill="#111111" text-anchor="middle" font-weight="bold">Cycle de travail sûr</text>
<rect x="60" y="100" width="300" height="90" rx="8" fill="#dbeafe" stroke="#1b2a41" stroke-width="2"/>
<text x="210.0" y="139.15" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">1. Lire</text>
<text x="210.0" y="163.45000000000002" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">Get-… </text>
<rect x="440" y="100" width="300" height="90" rx="8" fill="#fef9c3" stroke="#1b2a41" stroke-width="2"/>
<text x="590.0" y="139.15" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">2. Simuler</text>
<text x="590.0" y="163.45000000000002" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">-WhatIf</text>
<rect x="440" y="250" width="300" height="90" rx="8" fill="#fee2e2" stroke="#1b2a41" stroke-width="2"/>
<text x="590.0" y="289.15000000000003" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">3. Appliquer</text>
<text x="590.0" y="313.45000000000005" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">-Confirm si risque</text>
<rect x="60" y="250" width="300" height="90" rx="8" fill="#dcfce7" stroke="#1b2a41" stroke-width="2"/>
<text x="210.0" y="289.15000000000003" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle" font-weight="bold">4. Vérifier</text>
<text x="210.0" y="313.45000000000005" font-family="sans-serif" font-size="18" fill="#111111" text-anchor="middle">Get-… puis journal</text>
<line x1="360" y1="145" x2="440" y2="145" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="590" y1="190" x2="590" y2="250" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="440" y1="295" x2="360" y2="295" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="210" y1="250" x2="210" y2="190" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="385" font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">On ne passe à l&#x27;étape suivante que si le résultat de l&#x27;étape précédente est conforme.</text>
</svg>
