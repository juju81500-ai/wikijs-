<rect x="180" y="70" width="580" height="120" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="192" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#102030" text-anchor="start">Réseau « front »</text>
