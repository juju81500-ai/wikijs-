<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
<title id="t">Pile Docker Compose : proxy, application, base, réseaux, volume et secret</title>
<desc id="d">Un fichier compose.yaml décrit trois services. Le proxy est sur le réseau front, l'application sur front et back, la base de données uniquement sur back. La base utilise un volume nommé et un secret monté en fichier.</desc>
