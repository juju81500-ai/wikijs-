<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
<title id="t">Locataire Microsoft Entra ID et services Microsoft 365</title>
<desc id="d">Un locataire (tenant) Entra ID contient les utilisateurs, groupes, rôles d'administration et stratégies d'accès conditionnel. Il authentifie l'accès aux services Microsoft 365 comme la messagerie, le partage de fichiers et la collaboration.</desc>
