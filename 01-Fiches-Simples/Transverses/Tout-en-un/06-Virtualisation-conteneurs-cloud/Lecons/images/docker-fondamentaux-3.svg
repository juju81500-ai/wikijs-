<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">Réseau bridge, volume et port publié</title>
<desc id="d">Deux conteneurs, web et db, sont reliés par un réseau bridge défini par l'utilisateur et se joignent par leur nom. Le port 8080 de l'hôte est publié vers le port 80 du conteneur web. La base de données écrit dans un volume nommé.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
<rect width="800" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="760" height="340" rx="6" fill="#f6f8fa" stroke="#8a97a6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="start">Hôte Docker (192.0.2.10)</text>
<rect x="60" y="90" width="200" height="80" rx="6" fill="#fff6c9" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="160.0" y="126.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">Navigateur / client</text>
<text x="160.0" y="143.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">198.51.100.25</text>
<rect x="300" y="70" width="420" height="250" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="315" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#102030" text-anchor="start">Réseau bridge « appnet »</text>
<rect x="330" y="120" width="150" height="70" rx="6" fill="#dff3e3" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="405.0" y="151.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">conteneur web</text>
<text x="405.0" y="168.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">écoute sur :80</text>
<rect x="540" y="120" width="150" height="70" rx="6" fill="#dff3e3" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="615.0" y="151.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">conteneur db</text>
<text x="615.0" y="168.4" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="middle">écoute sur :5432</text>
<line x1="480" y1="155" x2="540" y2="155" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="510.0" y="147.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">web → db</text>
<rect x="540" y="240" width="150" height="50" rx="6" fill="#fde7cc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="615.0" y="261.7" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">Volume « dbdata »</text>
<text x="615.0" y="276.7" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">/var/lib/postgresql</text>
<line x1="615" y1="190" x2="615" y2="240" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="260" y1="130" x2="330" y2="150" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="273.0" y="116.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">8080→80</text>
<text x="40" y="215" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="start">Seul le port publié est</text>
<text x="40" y="235" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="start">joignable de l'extérieur ; la</text>
<text x="40" y="255" font-family="sans-serif" font-size="14" fill="#102030" text-anchor="start">base reste sur appnet.</text>
</svg>
