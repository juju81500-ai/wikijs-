<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
<title id="t">Cycle de vie : Dockerfile, build, image, registre, conteneur</title>
<desc id="d">Le Dockerfile est transformé en image par docker build ; l'image est publiée dans un registre par push, récupérée par pull, puis démarrée en conteneur par docker run.</desc>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
<rect width="800" height="330" fill="#ffffff"/>
<rect x="20" y="40" width="130" height="60" rx="6" fill="#fff6c9" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="85.0" y="66.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">Dockerfile</text>
<text x="85.0" y="84.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">+ contexte</text>
<rect x="215" y="40" width="130" height="60" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="280.0" y="66.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">Image locale</text>
<text x="280.0" y="84.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">mon-app:1.0</text>
<rect x="430" y="40" width="150" height="60" rx="6" fill="#e8dff5" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="505.0" y="66.7" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">Registre</text>
<text x="505.0" y="81.7" font-family="sans-serif" font-size="12" fill="#102030" text-anchor="middle">registry.example.com</text>
<rect x="640" y="40" width="140" height="60" rx="6" fill="#dbe9f8" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="710.0" y="66.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">Image sur un</text>
<text x="710.0" y="83.4" font-family="sans-serif" font-size="14" font-weight="bold" fill="#102030" text-anchor="middle">autre hôte</text>
<line x1="150" y1="70" x2="215" y2="70" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="182.5" y="62.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">build</text>
<line x1="345" y1="70" x2="430" y2="70" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="387.5" y="62.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">push</text>
<line x1="580" y1="70" x2="640" y2="70" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="610.0" y="62.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">pull</text>
<rect x="215" y="160" width="130" height="60" rx="6" fill="#dff3e3" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="280.0" y="186.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">Conteneur</text>
<text x="280.0" y="204.25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#102030" text-anchor="middle">(en exécution)</text>
<line x1="280" y1="100" x2="280" y2="160" stroke="#1f3a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="302.0" y="130.0" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">run</text>
<rect x="60" y="250" width="170" height="50" rx="6" fill="#fde7cc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="145.0" y="271.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">Volume nommé</text>
<text x="145.0" y="287.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">(données persistantes)</text>
<rect x="300" y="250" width="170" height="50" rx="6" fill="#fde7cc" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="385.0" y="271.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">Réseau bridge</text>
<text x="385.0" y="287.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">(DNS interne)</text>
<rect x="540" y="160" width="200" height="60" rx="6" fill="#e9ecef" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="640.0" y="186.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">Port publié 8080→80</text>
<text x="640.0" y="202.55" font-family="sans-serif" font-size="13" fill="#102030" text-anchor="middle">sur l'hôte</text>
<line x1="230" y1="250" x2="265" y2="220" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="385" y1="250" x2="315" y2="220" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<line x1="345" y1="190" x2="540" y2="190" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
</svg>
