<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Montage persistant : du démarrage au point de montage grâce à /etc/fstab</title>
<desc id="d">Au démarrage, systemd lit /etc/fstab, résout le serveur distant, monte le partage sur son point de montage, puis les applications utilisent le dossier local. Les options nofail et _netdev évitent de bloquer le démarrage si le réseau ou le serveur est absent.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker></defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">Cycle d'un montage persistant (fstab)</text>
<rect x="25" y="90" width="165" height="110" rx="8" fill="#cfe3ff" stroke="#1a1a1a" stroke-width="2"/>
<text x="107.5" y="130.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">1. Démarrage</text>
<text x="107.5" y="149.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">systemd lit</text>
<text x="107.5" y="168.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">/etc/fstab</text>
<line x1="190" y1="145" x2="220" y2="145" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="220" y="90" width="165" height="110" rx="8" fill="#fff3a8" stroke="#1a1a1a" stroke-width="2"/>
<text x="302.5" y="130.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">2. Réseau</text>
<text x="302.5" y="149.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">option _netdev :</text>
<text x="302.5" y="168.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">attendre le réseau</text>
<line x1="385" y1="145" x2="415" y2="145" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="415" y="90" width="165" height="110" rx="8" fill="#d4f2d4" stroke="#1a1a1a" stroke-width="2"/>
<text x="497.5" y="130.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">3. Montage</text>
<text x="497.5" y="149.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">mount du partage</text>
<text x="497.5" y="168.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">sur /mnt/partage</text>
<line x1="580" y1="145" x2="610" y2="145" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="610" y="90" width="165" height="110" rx="8" fill="#ffe2b8" stroke="#1a1a1a" stroke-width="2"/>
<text x="692.5" y="130.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" fill="#1a1a1a">4. Usage</text>
<text x="692.5" y="149.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">les applications</text>
<text x="692.5" y="168.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">lisent /mnt/partage</text>
<rect x="60" y="250" width="680" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="400.0" y="284.9" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">srv.example.test:/srv/partage  /mnt/partage  nfs  defaults,_netdev,nofail  0  0</text>
<text x="400" y="340" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Une ligne = source, point de montage, type, options, dump, fsck</text>
<text x="400" y="364" text-anchor="middle" font-size="14" font-family="DejaVu Sans, Arial, sans-serif" fill="#1a1a1a">Toujours tester avec « mount -a » avant de redémarrer.</text>
</svg>
