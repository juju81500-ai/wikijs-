<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Sélection d'un hôte virtuel selon le nom demandé</title>
<desc>Deux noms, www.example.com et api.example.test, pointent vers la même adresse IP 203.0.113.10. Le serveur web lit le nom dans l'indication SNI de TLS puis dans l'en-tête Host, et choisit le bloc server correspondant : racine de site statique ou proxy vers une application.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="430" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">Hôtes virtuels : une adresse IP, plusieurs sites</text>
<rect x="10" y="150" width="190" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="105.0" y="200.4" text-anchor="middle" font-size="14" fill="#111111">Requête</text>
<text x="105.0" y="219.4" text-anchor="middle" font-size="14" fill="#111111">Host: www.example.com</text>
<rect x="10" y="290" width="190" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="105.0" y="340.4" text-anchor="middle" font-size="14" fill="#111111">Requête</text>
<text x="105.0" y="359.4" text-anchor="middle" font-size="14" fill="#111111">Host: api.example.test</text>
<rect x="260" y="150" width="200" height="250" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="360.0" y="222.9" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Serveur web</text>
<text x="360.0" y="241.9" text-anchor="middle" font-size="14" fill="#111111">écoute 203.0.113.10</text>
<text x="360.0" y="260.9" text-anchor="middle" font-size="14" fill="#111111">ports 80 et 443</text>
<text x="360.0" y="279.9" text-anchor="middle" font-size="14" fill="#111111"></text>
<text x="360.0" y="298.9" text-anchor="middle" font-size="14" fill="#111111">1. SNI (TLS)</text>
<text x="360.0" y="317.9" text-anchor="middle" font-size="14" fill="#111111">2. en-tête Host</text>
<text x="360.0" y="336.9" text-anchor="middle" font-size="14" fill="#111111">3. sinon : site par défaut</text>
<rect x="560" y="120" width="220" height="100" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="670.0" y="155.9" text-anchor="middle" font-size="14" fill="#111111">server_name</text>
<text x="670.0" y="174.9" text-anchor="middle" font-size="14" fill="#111111">www.example.com</text>
<text x="670.0" y="193.9" text-anchor="middle" font-size="14" fill="#111111">racine /var/www/vitrine</text>
<rect x="560" y="250" width="220" height="100" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="670.0" y="285.9" text-anchor="middle" font-size="14" fill="#111111">server_name</text>
<text x="670.0" y="304.9" text-anchor="middle" font-size="14" fill="#111111">api.example.test</text>
<text x="670.0" y="323.9" text-anchor="middle" font-size="14" fill="#111111">proxy_pass 192.0.2.11</text>
<rect x="560" y="365" width="220" height="50" rx="8" fill="#fee2e2" stroke="#7f1d1d" stroke-width="2"/>
<text x="670.0" y="394.9" text-anchor="middle" font-size="14" fill="#111111">default_server : refuse (444)</text>
<line x1="200" y1="205" x2="258" y2="230" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="200" y1="345" x2="258" y2="330" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="462" y1="200" x2="558" y2="175" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="462" y1="290" x2="558" y2="300" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="462" y1="380" x2="558" y2="390" stroke="#7f1d1d" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 4"/>
</svg>
