<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" role="img">
<title>Hiérarchie des strates NTP</title>
<desc>Des horloges de référence (strate 0) alimentent des serveurs de strate 1. Ceux-ci synchronisent des serveurs de strate 2, qui à leur tour synchronisent le serveur interne chrony du réseau 192.0.2.0/24 en strate 3, puis les postes clients en strate 4.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="18" fill="#111111" font-weight="bold">NTP : une hiérarchie de strates</text>
<rect x="110" y="55" width="580" height="48" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="400.0" y="84.6" text-anchor="middle" font-size="16" fill="#111111">Strate 0 — Horloge de référence (GNSS, atomique)</text>
<line x1="400" y1="105" x2="400" y2="123" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="110" y="125" width="580" height="48" rx="8" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
<text x="400.0" y="154.6" text-anchor="middle" font-size="16" fill="#111111">Strate 1 — Serveurs publics de référence</text>
<line x1="400" y1="175" x2="400" y2="193" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="110" y="195" width="580" height="48" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
<text x="400.0" y="224.6" text-anchor="middle" font-size="16" fill="#111111">Strate 2 — Serveurs publics ou du fournisseur</text>
<line x1="400" y1="245" x2="400" y2="263" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="110" y="265" width="580" height="48" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="400.0" y="294.6" text-anchor="middle" font-size="16" fill="#111111">Strate 3 — Serveur chrony interne 192.0.2.5</text>
<line x1="400" y1="315" x2="400" y2="333" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="110" y="335" width="580" height="48" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
<text x="400.0" y="364.6" text-anchor="middle" font-size="16" fill="#111111">Strate 4 — Postes et serveurs 192.0.2.0/24</text>
<text x="400" y="408" text-anchor="middle" font-size="14" fill="#111111">Plus la strate est élevée, plus on est éloigné de la référence.</text>
</svg>
