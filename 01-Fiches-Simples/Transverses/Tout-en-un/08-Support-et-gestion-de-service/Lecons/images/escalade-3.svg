<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Étapes d&#x27;un post-mortem sans reproche</title>
<desc id="d">Cinq étapes numérotées : chronologie, impact, causes, ce qui a aidé, actions avec propriétaire et échéance.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect width="800" height="440" fill="#ffffff"/>
<text x="400" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">Post-mortem sans reproche : cinq temps</tspan></text>
<circle cx="60" cy="90" r="22" fill="#2c5282"/>
<text x="60" y="97" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff"><tspan x="60" dy="0">1</tspan></text>
<rect x="100" y="65" width="640" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="120" y="97" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="120" dy="0">Chronologie</tspan></text>
<text x="290" y="97" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="290" dy="0">faits datés, sans jugement</tspan></text>
<circle cx="60" cy="156" r="22" fill="#2c5282"/>
<text x="60" y="163" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff"><tspan x="60" dy="0">2</tspan></text>
<rect x="100" y="131" width="640" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="120" y="163" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="120" dy="0">Impact</tspan></text>
<text x="290" y="163" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="290" dy="0">qui, combien, combien de temps</tspan></text>
<circle cx="60" cy="222" r="22" fill="#2c5282"/>
<text x="60" y="229" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff"><tspan x="60" dy="0">3</tspan></text>
<rect x="100" y="197" width="640" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="120" y="229" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="120" dy="0">Causes</tspan></text>
<text x="290" y="229" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="290" dy="0">« pourquoi » en chaîne, facteurs systémiques</tspan></text>
<circle cx="60" cy="288" r="22" fill="#2c5282"/>
<text x="60" y="295" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff"><tspan x="60" dy="0">4</tspan></text>
<rect x="100" y="263" width="640" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="120" y="295" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="120" dy="0">Ce qui a aidé</tspan></text>
<text x="290" y="295" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="290" dy="0">détection, réflexes, outils</tspan></text>
<circle cx="60" cy="354" r="22" fill="#2c5282"/>
<text x="60" y="361" font-size="20" text-anchor="middle" font-weight="bold" fill="#ffffff"><tspan x="60" dy="0">5</tspan></text>
<rect x="100" y="329" width="640" height="52" rx="8" fill="#e8f1fb" stroke="#2c5282" stroke-width="2"/>
<text x="120" y="361" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a"><tspan x="120" dy="0">Actions</tspan></text>
<text x="290" y="361" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a"><tspan x="290" dy="0">propriétaire + échéance</tspan></text>
<text x="400" y="415" font-size="14" text-anchor="middle" font-weight="bold" fill="#34495e"><tspan x="400" dy="0">Question clé : « Comment le système a-t-il permis cette erreur ? » et non « Qui s&#x27;est trompé ? »</tspan></text>

</svg>
