<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Matrice de priorité impact et urgence</title>
<desc id="d">Tableau de trois lignes d&#x27;impact et trois colonnes d&#x27;urgence donnant une priorité de P1 à P5, P1 en haut à droite.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect width="800" height="460" fill="#ffffff"/>
<text x="400" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">Priorité = impact × urgence (exemple d&#x27;échelle)</tspan></text>
<text x="330" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="330" dy="0">Urgence faible</tspan></text>
<text x="470" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="470" dy="0">Urgence moyenne</tspan></text>
<text x="610" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="610" dy="0">Urgence forte</tspan></text>
<text x="150" y="138" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a"><tspan x="150" dy="0">Impact fort</tspan></text>
<rect x="262" y="95" width="136" height="80" rx="6" fill="#fdf1b0" stroke="#34495e" stroke-width="2"/>
<text x="330" y="145" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="330" dy="0">P3</tspan></text>
<rect x="402" y="95" width="136" height="80" rx="6" fill="#f9d6a5" stroke="#34495e" stroke-width="2"/>
<text x="470" y="145" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="470" dy="0">P2</tspan></text>
<rect x="542" y="95" width="136" height="80" rx="6" fill="#f5b7b1" stroke="#34495e" stroke-width="2"/>
<text x="610" y="145" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="610" dy="0">P1</tspan></text>
<text x="150" y="228" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a"><tspan x="150" dy="0">Impact moyen</tspan></text>
<rect x="262" y="185" width="136" height="80" rx="6" fill="#d5efc7" stroke="#34495e" stroke-width="2"/>
<text x="330" y="235" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="330" dy="0">P4</tspan></text>
<rect x="402" y="185" width="136" height="80" rx="6" fill="#fdf1b0" stroke="#34495e" stroke-width="2"/>
<text x="470" y="235" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="470" dy="0">P3</tspan></text>
<rect x="542" y="185" width="136" height="80" rx="6" fill="#f9d6a5" stroke="#34495e" stroke-width="2"/>
<text x="610" y="235" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="610" dy="0">P2</tspan></text>
<text x="150" y="318" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a"><tspan x="150" dy="0">Impact faible</tspan></text>
<rect x="262" y="275" width="136" height="80" rx="6" fill="#dbe9f7" stroke="#34495e" stroke-width="2"/>
<text x="330" y="325" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="330" dy="0">P5</tspan></text>
<rect x="402" y="275" width="136" height="80" rx="6" fill="#d5efc7" stroke="#34495e" stroke-width="2"/>
<text x="470" y="325" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="470" dy="0">P4</tspan></text>
<rect x="542" y="275" width="136" height="80" rx="6" fill="#fdf1b0" stroke="#34495e" stroke-width="2"/>
<text x="610" y="325" font-size="26" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="610" dy="0">P3</tspan></text>
<text x="400" y="385" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a"><tspan x="400" dy="0">Impact : combien de personnes ou d&#x27;activités sont touchées ?</tspan></text>
<text x="400" y="408" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a"><tspan x="400" dy="0">Urgence : dans quel délai la gêne devient-elle inacceptable ?</tspan></text>
<text x="400" y="440" font-size="14" text-anchor="middle" font-weight="normal" fill="#34495e"><tspan x="400" dy="0">P1 = traitement immédiat, P5 = planifiable. Les seuils exacts sont fixés par votre organisation.</tspan></text>

</svg>
