<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Niveaux N1, N2 et N3 et types d&#x27;escalade</title>
<desc id="d">Pyramide de trois niveaux de support avec une flèche d&#x27;escalade fonctionnelle vers l&#x27;expertise et une flèche d&#x27;escalade hiérarchique vers le management.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34495e"/></marker></defs>
<rect width="800" height="420" fill="#ffffff"/>
<text x="400" y="34" font-size="20" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400" dy="0">Niveaux de support et deux sortes d&#x27;escalade</tspan></text>
<polygon points="230,70 330,70 400,300 60,300" fill="#fff" stroke="none"/>
<rect x="300" y="70" width="200" height="70" rx="8" fill="#e8e4fb" stroke="#4a3a9b" stroke-width="2"/>
<text x="400.0" y="100" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400.0" dy="0">N3</tspan></text>
<text x="400.0" y="124" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a"><tspan x="400.0" dy="0">Expertise, conception, éditeur</tspan></text>
<rect x="240" y="150" width="320" height="70" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
<text x="400.0" y="180" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400.0" dy="0">N2</tspan></text>
<text x="400.0" y="204" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a"><tspan x="400.0" dy="0">Diagnostic approfondi, administration</tspan></text>
<rect x="180" y="230" width="440" height="70" rx="8" fill="#e1f5e6" stroke="#1e6b34" stroke-width="2"/>
<text x="400.0" y="260" font-size="22" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="400.0" dy="0">N1</tspan></text>
<text x="400.0" y="284" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a"><tspan x="400.0" dy="0">Accueil, qualification, résolution simple</tspan></text>
<line x1="130" y1="300" x2="130" y2="80" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<text x="130" y="332" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="130" dy="0">Escalade</tspan><tspan x="130" dy="18.2">hiérarchique</tspan></text>
<text x="130" y="60" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="130" dy="0">Information du management</tspan></text>
<line x1="700" y1="265" x2="700" y2="105" stroke="#34495e" stroke-width="2.5" marker-end="url(#a)"/>
<text x="700" y="330" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="700" dy="0">Escalade</tspan><tspan x="700" dy="18.2">fonctionnelle</tspan></text>
<text x="700" y="60" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a"><tspan x="700" dy="0">Vers plus de compétence</tspan></text>
<text x="400" y="385" font-size="14" text-anchor="middle" font-weight="normal" fill="#34495e"><tspan x="400" dy="0">Escalader n&#x27;est pas un échec : c&#x27;est transmettre un dossier complet à la bonne personne.</tspan></text>

</svg>
