<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Flux simplifié OpenID Connect (code d'autorisation)</title>
  <desc id="d">Trois acteurs : l'utilisateur avec son navigateur, l'application (client) et le fournisseur d'identité (IdP). 1. L'utilisateur ouvre l'application. 2. L'application redirige vers l'IdP. 3. L'utilisateur s'authentifie sur l'IdP, avec MFA éventuel. 4. L'IdP redirige vers l'application avec un code à usage unique. 5. L'application échange le code contre un jeton d'identité (ID token) et un jeton d'accès, en appelant directement l'IdP. 6. L'application vérifie la signature du jeton et ouvre la session.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
  </defs>
  <rect width="800" height="440" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111111">OIDC : le code d'autorisation en 6 étapes</text>
  <g font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111" text-anchor="middle">
    <rect x="20" y="50" width="200" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="120" y="82">Utilisateur</text>
    <rect x="300" y="50" width="200" height="50" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="400" y="82">Application</text>
    <rect x="580" y="50" width="200" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="680" y="82" font-size="15">Fournisseur d'identité</text>
  </g>
  <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 5">
    <line x1="120" y1="100" x2="120" y2="340"/>
    <line x1="400" y1="100" x2="400" y2="340"/>
    <line x1="680" y1="100" x2="680" y2="340"/>
  </g>
  <g stroke="#111111" stroke-width="2.5" marker-end="url(#a)">
    <line x1="122" y1="130" x2="396" y2="130"/>
    <line x1="398" y1="160" x2="124" y2="160"/>
    <line x1="122" y1="190" x2="676" y2="190"/>
    <line x1="678" y1="220" x2="124" y2="220"/>
    <line x1="122" y1="250" x2="396" y2="250"/>
    <line x1="402" y1="280" x2="676" y2="280"/>
    <line x1="678" y1="305" x2="404" y2="305"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#111111" text-anchor="middle">
    <text x="260" y="122">① Ouvre l'application</text>
    <text x="260" y="152">② Redirection vers l'IdP</text>
    <text x="400" y="182">③ Authentification + MFA</text>
    <text x="400" y="212">④ Redirection avec un code à usage unique</text>
    <text x="260" y="242">⑤ Le code est transmis</text>
    <text x="540" y="272">⑤ Code échangé (canal direct)</text>
    <text x="540" y="298">ID token + jeton d'accès</text>
  </g>
  <rect x="20" y="355" width="760" height="70" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#111111">
    <text x="36" y="381">⑥ L'application vérifie la signature, l'émetteur (iss), l'audience (aud) et l'expiration (exp)</text>
    <text x="36" y="405">du jeton avant d'ouvrir la session. Le mot de passe n'est jamais vu par l'application.</text>
  </g>
</svg>
