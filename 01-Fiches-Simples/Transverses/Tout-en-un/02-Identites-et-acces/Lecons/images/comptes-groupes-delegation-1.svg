<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="sans-serif">
  <title id="t">Modèle AGDLP : comptes, groupes globaux, groupes de domaine local, permissions</title>
  <desc id="d">Quatre blocs reliés de gauche à droite. A : des comptes utilisateurs (alice, bruno). G : le groupe global GG_Compta qui les regroupe par fonction. DL : le groupe de domaine local DL_Compta_Modif qui représente un droit sur une ressource. P : la permission Modifier sur le dossier \\SRV-FICHIERS\Compta.</desc>
  <rect width="800" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#222222"/></marker>
  </defs>
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#0b2e59">AGDLP : Account → Global → Domain Local → Permission</text>

  <rect x="20" y="70" width="160" height="180" rx="10" fill="#e6e6e6" stroke="#333333" stroke-width="3"/>
  <text x="100" y="100" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">A</text>
  <text x="100" y="124" font-size="15" text-anchor="middle" fill="#111111">Comptes</text>
  <text x="100" y="168" font-size="14" text-anchor="middle" fill="#111111">alice.martin</text>
  <text x="100" y="192" font-size="14" text-anchor="middle" fill="#111111">bruno.durand</text>
  <text x="100" y="228" font-size="13" text-anchor="middle" fill="#444444">les personnes</text>

  <rect x="226" y="70" width="160" height="180" rx="10" fill="#d6e6f8" stroke="#0b2e59" stroke-width="3"/>
  <text x="306" y="100" font-size="20" font-weight="bold" text-anchor="middle" fill="#0b2e59">G</text>
  <text x="306" y="124" font-size="15" text-anchor="middle" fill="#0b2e59">Groupe global</text>
  <text x="306" y="168" font-size="14" text-anchor="middle" fill="#111111">GG_Compta</text>
  <text x="306" y="228" font-size="13" text-anchor="middle" fill="#444444">le rôle métier</text>

  <rect x="432" y="70" width="160" height="180" rx="10" fill="#fff0c2" stroke="#8a6200" stroke-width="3"/>
  <text x="512" y="100" font-size="20" font-weight="bold" text-anchor="middle" fill="#5a4000">DL</text>
  <text x="512" y="124" font-size="15" text-anchor="middle" fill="#5a4000">Domaine local</text>
  <text x="512" y="168" font-size="13" text-anchor="middle" fill="#111111">DL_Compta_Modif</text>
  <text x="512" y="228" font-size="13" text-anchor="middle" fill="#444444">droit sur ressource</text>

  <rect x="638" y="70" width="142" height="180" rx="10" fill="#d9f2d9" stroke="#1b5e20" stroke-width="3"/>
  <text x="709" y="100" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">P</text>
  <text x="709" y="124" font-size="15" text-anchor="middle" fill="#1b5e20">Permission</text>
  <text x="709" y="168" font-size="14" text-anchor="middle" fill="#111111">Modifier sur</text>
  <text x="709" y="190" font-size="13" text-anchor="middle" fill="#111111">\\SRV-FICHIERS</text>
  <text x="709" y="208" font-size="13" text-anchor="middle" fill="#111111">\Compta</text>

  <line x1="180" y1="160" x2="224" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#a)"/>
  <line x1="386" y1="160" x2="430" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#a)"/>
  <line x1="592" y1="160" x2="636" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#a)"/>

  <rect x="20" y="290" width="760" height="86" rx="10" fill="#f3f3f3" stroke="#333333" stroke-width="2"/>
  <text x="400" y="320" font-size="16" text-anchor="middle" fill="#111111">Arrivée, mobilité, départ : on ne modifie que l'appartenance aux groupes globaux.</text>
  <text x="400" y="346" font-size="16" text-anchor="middle" fill="#111111">Les ACL des dossiers ne contiennent que des groupes DL, jamais des personnes.</text>
</svg>
