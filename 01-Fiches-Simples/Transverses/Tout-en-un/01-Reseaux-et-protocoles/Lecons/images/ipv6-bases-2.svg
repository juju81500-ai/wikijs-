<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">Les principaux types d'adresses IPv6 avec leur préfixe, leur portée et un exemple</title>
  <desc id="d">Tableau de sept lignes : global unicast 2000::/3, unique local fc00::/7, lien local fe80::/10, multicast ff00::/8, bouclage ::1/128, non spécifiée ::/128 et documentation 2001:db8::/32, avec portée et exemple d'adresse.</desc>
  <rect width="800" height="420" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#111111">
  <text x="400" y="26" font-size="20" font-weight="bold" text-anchor="middle">Types d'adresses IPv6 à connaître</text>
  <rect x="20" y="42" width="760" height="32" fill="#1f2937"/>
  <g fill="#ffffff" font-weight="bold"><text x="30" y="63">Type</text><text x="210" y="63">Préfixe</text><text x="400" y="63">Portée</text><text x="580" y="63">Exemple</text></g>
<rect x="20" y="74" width="760" height="44" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="101" font-weight="bold">Global unicast</text>
<text x="210" y="101" font-family="monospace" font-size="14">2000::/3</text>
<text x="400" y="101" font-size="13">Internet entier</text>
<text x="580" y="101" font-family="monospace" font-size="12">2001:db8:acad:1::10</text>
<rect x="20" y="118" width="760" height="44" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="145" font-weight="bold">Unique local (ULA)</text>
<text x="210" y="145" font-family="monospace" font-size="12">fc00::/7</text>
<text x="400" y="145" font-size="13">Interne à l’organisation</text>
<text x="580" y="145" font-family="monospace" font-size="12">fd12:3456:789a:1::5</text>
<rect x="20" y="162" width="760" height="44" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="189" font-weight="bold">Lien local</text>
<text x="210" y="189" font-family="monospace" font-size="14">fe80::/10</text>
<text x="400" y="189" font-size="13">Un seul lien physique</text>
<text x="580" y="189" font-family="monospace" font-size="12">fe80::1c2b:3d4e:5f60:7182</text>
<rect x="20" y="206" width="760" height="44" fill="#fce7f3" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="233" font-weight="bold">Multicast</text>
<text x="210" y="233" font-family="monospace" font-size="14">ff00::/8</text>
<text x="400" y="233" font-size="13">Selon la portée</text>
<text x="580" y="233" font-family="monospace" font-size="12">ff02::1 (tous les nœuds)</text>
<rect x="20" y="250" width="760" height="44" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="277" font-weight="bold">Bouclage</text>
<text x="210" y="277" font-family="monospace" font-size="14">::1/128</text>
<text x="400" y="277" font-size="13">L'hôte lui-même</text>
<text x="580" y="277" font-family="monospace" font-size="12">::1</text>
<rect x="20" y="294" width="760" height="44" fill="#e5e7eb" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="321" font-weight="bold">Non spécifiée</text>
<text x="210" y="321" font-family="monospace" font-size="14">::/128</text>
<text x="400" y="321" font-size="13">Adresse source inconnue</text>
<text x="580" y="321" font-family="monospace" font-size="12">::</text>
<rect x="20" y="338" width="760" height="44" fill="#fed7aa" stroke="#334155" stroke-width="1.5"/>
<text x="30" y="365" font-weight="bold">Documentation</text>
<text x="210" y="365" font-family="monospace" font-size="14">2001:db8::/32</text>
<text x="400" y="365" font-size="13">Aucune (exemples)</text>
<text x="580" y="365" font-family="monospace" font-size="12">2001:db8::1</text>
<text x="400" y="404" text-anchor="middle" font-size="12">Création originale du projet Pack Master (CC0). IPv6 n'a pas de diffusion (broadcast) : elle est remplacée par le multicast.</text>
</g></svg>