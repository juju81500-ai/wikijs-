<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
<title id="t">Poignée de main TLS 1.3 simplifiée</title>
<desc id="d">Le client envoie ClientHello avec un partage de clé, le serveur répond ServerHello, son certificat et une preuve de possession de la clé. Les deux dérivent des clés de session et chiffrent les données applicatives.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b1b1b"/></marker></defs>
<rect width="900" height="500" fill="#ffffff"/>
<text x="450" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">TLS 1.3 : de la poignée de main aux données chiffrées</text>
<rect x="60" y="55" width="200" height="45" rx="8" fill="#dbe7ff" stroke="#1a3d7c" stroke-width="2"/>
<text x="160.0" y="82.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Client (navigateur)</text>
<rect x="640" y="55" width="200" height="45" rx="8" fill="#b8e6c4" stroke="#1c6b34" stroke-width="2"/>
<text x="740.0" y="82.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111111">Serveur www.example.com</text>
<line x1="160" y1="100" x2="160" y2="470" stroke="#1a3d7c" stroke-width="2" stroke-dasharray="4 4"/><line x1="740" y1="100" x2="740" y2="470" stroke="#1c6b34" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="160" y1="135" x2="740" y2="135" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">1. ClientHello : versions, suites, partage de clé, SNI</text>
<line x1="740" y1="185" x2="160" y2="185" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">2. ServerHello + partage de clé (la suite chiffrée commence ici)</text>
<line x1="740" y1="235" x2="160" y2="235" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">3. Certificat + signature « CertificateVerify »</text>
<line x1="740" y1="285" x2="160" y2="285" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">4. Finished (MAC de tout l'échange)</text>
<line x1="160" y1="335" x2="740" y2="335" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">5. Finished du client</text>
<line x1="160" y1="395" x2="740" y2="395" stroke="#1c6b34" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">6. Données applicatives chiffrées (AEAD)</text>
<line x1="740" y1="440" x2="160" y2="440" stroke="#1c6b34" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">Données applicatives chiffrées</text>
<text x="450" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Le client contrôle chaîne, dates et nom du certificat entre les étapes 3 et 4.</text>
</svg>
