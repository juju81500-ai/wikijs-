<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
<title id="t">Plusieurs façades, un même moteur de filtrage</title>
<desc id="d">Sous Linux, ufw et firewalld pilotent nftables dans le noyau Netfilter ; sous Windows, le pare-feu Defender avec fonctions avancées filtre selon trois profils réseau.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a41"/></marker></defs>
<rect width="800" height="400" fill="#ffffff"/>
<text x="400" y="34" font-size="20" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Linux et Windows : outils différents, mêmes principes</text>
<text x="220" y="72" font-size="20" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Linux</text>
<text x="600" y="72" font-size="20" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Windows</text>
<rect x="40" y="90" width="150" height="50" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="115.0" y="120.6" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">ufw</text>
<rect x="220" y="90" width="150" height="50" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="295.0" y="120.6" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">firewalld</text>
<rect x="40" y="180" width="330" height="55" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="205.0" y="213.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">nftables (règles : tables, chaînes)</text>
<rect x="40" y="275" width="330" height="55" rx="10" fill="#ece6f7" stroke="#1b2a41" stroke-width="2"/>
<text x="205.0" y="308.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Netfilter (noyau Linux)</text>
<line x1="115" y1="140" x2="115" y2="180" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="295" y1="140" x2="295" y2="180" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="205" y1="235" x2="205" y2="275" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<rect x="430" y="90" width="340" height="50" rx="10" fill="#e8f1fb" stroke="#1b2a41" stroke-width="2"/>
<text x="600.0" y="120.6" font-size="16" fill="#111111" text-anchor="middle" font-weight="bold" font-family="sans-serif">Pare-feu Windows Defender</text>
<rect x="430" y="180" width="340" height="55" rx="10" fill="#fff3c4" stroke="#1b2a41" stroke-width="2"/>
<text x="600.0" y="213.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Profils : Domaine / Privé / Public</text>
<rect x="430" y="275" width="340" height="55" rx="10" fill="#ece6f7" stroke="#1b2a41" stroke-width="2"/>
<text x="600.0" y="308.1" font-size="16" fill="#111111" text-anchor="middle" font-weight="normal" font-family="sans-serif">Moteur de filtrage (WFP, noyau)</text>
<line x1="600" y1="140" x2="600" y2="180" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<line x1="600" y1="235" x2="600" y2="275" stroke="#1b2a41" stroke-width="3" marker-end="url(#a)"/>
<text x="400" y="375" font-size="15" fill="#8a1c12" text-anchor="middle" font-weight="normal" font-family="sans-serif">Un seul outil de gestion actif à la fois : mélanger les façades produit des règles imprévisibles.</text>
</svg>
