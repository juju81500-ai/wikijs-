<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
<title id="t">Cycle de gestion des correctifs</title>
<desc id="d">Cinq étapes en boucle : inventorier, évaluer, tester et sauvegarder, déployer par vagues, vérifier et documenter.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b1b1b"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Gestion des correctifs : un cycle, pas un événement</text>
<rect x="20" y="120" width="140" height="110" rx="8" fill="#dbe7ff" stroke="#1a3d7c" stroke-width="2"/>
<text x="90.0" y="152.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">1. Inventorier</text>
<text x="90.0" y="170.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">parc</text>
<text x="90.0" y="188.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">versions</text>
<text x="90.0" y="206.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">expositions</text>
<line x1="160" y1="175" x2="200" y2="175" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="200" y="120" width="140" height="110" rx="8" fill="#ffe08a" stroke="#1a3d7c" stroke-width="2"/>
<text x="270.0" y="152.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">2. Évaluer</text>
<text x="270.0" y="170.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">gravité</text>
<text x="270.0" y="188.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">exposition</text>
<text x="270.0" y="206.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">exploitation connue</text>
<line x1="340" y1="175" x2="380" y2="175" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="380" y="120" width="140" height="110" rx="8" fill="#fff0f0" stroke="#1a3d7c" stroke-width="2"/>
<text x="450.0" y="152.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">3. Préparer</text>
<text x="450.0" y="170.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">snapshot</text>
<text x="450.0" y="188.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">test</text>
<text x="450.0" y="206.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">retour arrière</text>
<line x1="520" y1="175" x2="560" y2="175" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="560" y="120" width="140" height="110" rx="8" fill="#b8e6c4" stroke="#1a3d7c" stroke-width="2"/>
<text x="630.0" y="161.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">4. Déployer</text>
<text x="630.0" y="179.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">pilote</text>
<text x="630.0" y="197.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">puis production</text>
<line x1="700" y1="175" x2="740" y2="175" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="740" y="120" width="140" height="110" rx="8" fill="#eef3fb" stroke="#1a3d7c" stroke-width="2"/>
<text x="810.0" y="152.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">5. Vérifier</text>
<text x="810.0" y="170.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">versions</text>
<text x="810.0" y="188.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">journaux</text>
<text x="810.0" y="206.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#111111">documentation</text>
<line x1="810" y1="230" x2="810" y2="300" stroke="#555555" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="810" y1="300" x2="90" y2="300" stroke="#555555" stroke-width="2.2" marker-end="url(#a)"/>
<line x1="90" y1="300" x2="90" y2="232" stroke="#555555" stroke-width="2.2" marker-end="url(#a)"/>
<text x="450" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">retour à l'étape 1 : nouvelle version, nouvelle alerte, nouvel actif</text>
<text x="450" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#111111">Cas d'urgence : une vulnérabilité exploitée activement raccourcit les délais, jamais les garde-fous.</text>
</svg>
